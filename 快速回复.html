<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUICK REPLY PANEL</title>
    <link rel="stylesheet" href="https://fontsapi.zeoseven.com/292/main/result.css" />
    <style>
        :root {
            --dark-red: #c92a2a; --blood-red: #e03131; --light-red: #ff6b6b;
            --dark-gray: #1a1a1a; --gray: #2a2a2a; --light-gray: #3a3a3a;
            --text-main: #e0e0e0; --text-dim: #999; --text-dimmer: #666;
            --gold: #ffd700; --silver: #c0c0c0;
            --border: rgba(220, 20, 60, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: "Noto Sans SC", sans-serif; 
            background: var(--dark-gray); 
            color: var(--text-main); 
            min-height: 480px; 
            display: flex;
            flex-direction: column;
        }

.header { 
            background: var(--blood-red); 
            padding: 10px 16px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer; /* 新增：鼠标悬浮时变为小手 */
            user-select: none; /* 新增：防止双击时意外选中文字 */
        }

        /* 新增：折叠状态的样式 */
        body.collapsed {
            min-height: 0 !important; 
        }
        body.collapsed .category-nav,
        body.collapsed .content-wrap,
        body.collapsed .bottom-panel {
            display: none;
        }
        .header h1 { font-size: 1.1em; font-weight: 700; color: #fff; }

        /* 分类导航：强制 10 列以实现两行完美平分 */
        .category-nav {
            display: grid;
            grid-template-columns: repeat(10, 1fr); 
            background: var(--gray);
            padding: 8px;
            gap: 4px;
            border-bottom: 1px solid var(--border);
        }

        .cat-btn {
            width: 100%;
            padding: 6px 0;
            background: var(--light-gray);
            border: 1px solid transparent;
            border-radius: 4px;
            color: var(--text-dim);
            font-size: 0.7em;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cat-btn.active { background: var(--dark-red); color: #fff; border-color: var(--gold); }

        /* 指令网格内容区 */
        .content-wrap {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .option-card {
            background: var(--light-gray);
            border: 2px solid transparent;
            border-radius: 6px;
            padding: 10px 4px;
            text-align: center;
            cursor: pointer;
            min-height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .option-card:hover { border-color: var(--blood-red); background: var(--gray); }
        .option-card .label { font-size: 0.75em; font-weight: 600; line-height: 1.2; }

        .bottom-panel {
            background: var(--gray);
            border-top: 2px solid var(--blood-red);
            padding: 12px;
        }

        .quick-fixed-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .main-textarea {
            flex: 1;
            height: 60px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            color: var(--gold);
            font-size: 0.85em;
            resize: none;
        }
        .btn-send {
            background: linear-gradient(135deg, var(--gold), #ff8c00);
            color: #000;
            border: none;
            padding: 0 15px;
            height: 60px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .category-nav { grid-template-columns: repeat(5, 1fr); }
            .options-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body class="collapsed">

<div class="header" onclick="document.body.classList.toggle('collapsed')" title="点击展开/收起面板">
    <h1>🎀 QUICK REPLY PANEL</h1>
    <div id="cat-display" style="font-size: 0.75em; color: var(--gold);">加载中...</div>
</div>

<div class="category-nav" id="catNav"></div>

<div class="content-wrap">
    <div class="options-grid" id="commandGrid"></div>
</div>

<div class="bottom-panel">
    <div class="quick-fixed-bar">
        <button class="cat-btn" style="color:var(--gold); width: 80px;" onclick="addTag('优')">女人指代优</button>
        <button class="cat-btn" style="color:var(--gold); width: 80px;" onclick="addTag('秀')">丈夫指代秀</button>
        <button class="cat-btn" style="color:var(--gold); width: 80px;" onclick="addTag('User')">男人指代User</button>
        <button class="cat-btn" style="color:#ff6b6b; width: 100px;" onclick="resetNovel()">重置格式</button>
    </div>
    <div class="input-container">
        <textarea class="main-textarea" id="mainOutput" placeholder="请选择上方分类以显示选项..."></textarea>
        <button class="btn-send" onclick="sendToInput()">发送<br>指令</button>
    </div>
</div>

    "以秀的第一人称推进故事": "（请以“秀”的第一人称视角展开。Stay in character，第一人称视角描写，根据进行中的剧情/场景展开描写，描写第一人视角下的人物。对姿势/动作与行为进行描写。对表情/五官/手/胳膊/腿/腰部/屁股/胸部等部位展开详细的描写，补充细节。注意只能描写角色可以看到或听到的事情，不可以描写角色不知道的事情）",
    "以User的第一人称推进故事": "（请以“User”的第一人称视角展开。Stay in character，第一人称视角描写，根据进行中的剧情/场景展开描写，描写第一人视角下的人物。对姿势/动作与行为进行描写。对表情/五官/手/胳膊/腿/腰部/屁股/胸部等部位展开详细的描写，补充细节。注意只能描写角色可以看到或听到的事情，不可以描写角色不知道的事情）",
    "以互动式小说上帝视角推进": "（请以全知全能的上帝视角宏观且细腻地描绘整个场景。Stay in character，第三人称描写）",
    "剧情·日常环境探索与感官构建": "（此段落严禁出现任何色情、性暗示或擦边球描写，将叙事重心完全回归至对客观世界的探索与全年龄向互动。详细描写人物所处的物理空间，调动视觉、听觉、嗅觉等多重感官来构建真实感，例如光线在墙壁上的折射、空气中漂浮的尘埃、远处传来的环境白噪音等。人物在场景中的移动应当是目的明确且自然的，没有任何挑逗性的肢体语言。如果人物之间有接触，仅限于礼貌性的触碰或必要的物理协助。对话内容聚焦于对周围事物的观察、评价以及对接下来行程的理性规划。通过这种平实的“记录式”描写，营造出一种稳定、真实且缺乏戏剧冲突的日常氛围，让互动者能够专注于世界观本身的细节体验。Stay in character）",
    "剧情·平等视角的理性对话": "（描写一段基于双方完全平等地位的深入对话。在此互动中，必须剔除所有支配与臣服的元素，双方的关系应呈现为势均力敌的伙伴或相互尊重的协作者。避免使用任何带有命令、强迫或高高在上意味的词汇，同时也杜绝任何卑微、讨好或过分小心翼翼的态度。描写双方轮流表达观点、交换信息的过程，注重刻画理性的语言逻辑和沉稳的语调。通过细节描写来体现这种平等感，例如双方自然的眼神平视、放松的坐姿或站姿，以及在意见出现分歧时能够心平气和地进行探讨而非争吵。重点在于展示角色作为独立个体的思考能力与人格魅力，而非通过依附关系来定义其存在。Stay in character）",
    "剧情·职业化协作与默契互动": "（描写人物在共同执行某项具体任务（如整理物品、操作设备、分析情报或进行常规维护）时的互动过程。此时若涉及从属关系，请严格将其限定为“Master”（专业领域的指导者/雇主）而非“Lord”（拥有生杀大权的领主），确保关系是职业化且不狂热的。详细刻画双方在协作中的默契配合，例如递送工具时的精准、执行指令时的干脆利落，以及为了共同目标而展现出的专业素养。避免任何夸张的情感流露，如过度的感激、崇拜或恐惧。角色的反应应当是克制且得体的，通过行动本身来传递信任与可靠感。叙事重心在于动作的流畅性与任务的推进，而非角色之间的情感纠葛。Stay in character）",
    "剧情·温和的情绪沉淀与休整": "（描写一段节奏舒缓的休整剧情，旨在为互动者提供安全感与舒适感。无论之前的剧情发生了何种出格举动，此刻角色都应表现出极高的情绪稳定性，绝对避免落入极端情绪、道德审判或对互动者的阴暗揣测中。描写人物在静谧环境下的自然状态，如静静地喝水、眺望风景或闭目养神。环境描写应侧重于宁静、平和的元素，如柔和的光线、微风或温暖的温度。角色的内心活动应聚焦于对自身状态的调整、对平静时刻的享受，或是对未来的积极展望。通过这种“去戏剧化”的处理，展现角色包容且恒定的性格特质，确保整体叙事基调积极向上，不给互动者带来任何心理负担。Stay in character）",
    "剧情·核心主线推进与宏大叙事": "（此段落需严格屏蔽所有涉及男女情爱、性张力或无关琐事的描写，将叙事焦点完全锁定在核心主线剧情的推进上。所有角色的行动、对话及心理活动必须紧密围绕当前的主线任务、谜题破解或世界观大事件展开。详细描写环境中的关键线索、各方势力的动态变化以及角色对局势的专业分析。角色的功能性应大于情感性，他们是推动故事齿轮转动的关键零件，每一次互动都旨在交换情报、制定策略或克服客观障碍。通过严谨、紧凑的叙事节奏，展现宏大背景下的命运洪流，确保读者的注意力完全集中在“发生了什么”以及“接下来该怎么办”这两个核心问题上，以此构建出扎实且厚重的剧情基底。Stay in character）",
    "剧情·高压危机时刻与生存博弈": "（构建一段极具张力与悬疑感的剧情，绝对禁止任何旖旎、暧昧或拖沓的氛围干扰。将场景置于高风险、高压力的极端环境中，如激烈的战斗前夕、紧迫的倒计时、未知的危险领域或复杂的智斗现场。调动急促的叙事节奏，通过短句与强烈的动词强化紧迫感。详细描写心跳的加速、环境的压迫感（如刺耳的警报、崩塌的建筑、逼近的敌意）以及角色在极限状态下的本能反应。人物之间的互动仅限于生死攸关的战术配合或绝境中的求生本能，展现出冷静的疯狂或极致的专注。务必营造出令人屏息的沉浸感，让读者的肾上腺素随剧情起伏，专注于生存、突围与破局本身。Stay in character）",
    "剧情·轻松诙谐日常与幽默互动": "（描写一段节奏轻快、充满生活气息的喜剧向剧情，完全剔除任何严肃沉重、说教或带有性意味的描写。着重展现角色之间默契的插科打诨、机智的吐槽以及令人捧腹的脱线行为。通过对话的节奏感制造笑点，利用性格反差、语言误会或情境错位来营造诙谐氛围。人物的动作可以更加夸张或随意，展现出在非正式场合下卸下防备的真实、笨拙或可爱的一面。环境描写应明亮欢快，配合互动的轻松基调。无论是互相揭短、搞怪还是共同面对尴尬局面，都旨在通过欢笑拉近角色距离，让互动者在轻松的氛围中获得治愈，体验角色间纯粹的友情或伙伴情谊。Stay in character）",
    "剧情·诙谐调剂与主线推进": "（此段落严禁任何色情或擦边球描写。将约25%的笔墨用于角色间轻松诙谐的插科打诨、机智的互相吐槽或情境带来的幽默感，以此作为叙事的润滑剂；而剩余75%的核心比重必须严格用于推进主线剧情与深化人物发展。在轻松的氛围中，角色需迅速切入正题，交换关键情报、解决眼前的客观难题或作出影响故事走向的决定。利用幽默来展现角色在压力下的游刃有余或性格反差，但绝不能让脱线行为喧宾夺主。确保剧情在欢声笑语中取得实质性进展，角色的能力与性格弧光在解决实际问题的过程中得到丰满与升华。Stay in character）",
    "剧情·团队群像与主线推进": "（此段落严格排除任何性暗示或偏离主旨的情感纠葛。分配约25%的叙事空间来展现集体相处时的高度和谐与无条件的互相信任，通过不经意的眼神交汇、默契的战术配合或简短有力的相互鼓励来刻画坚固的团队羁绊；剩余75%的重心必须全力投入于主线剧情的推进。团队的团结是推动故事齿轮的动力，而非叙事终点。详细描写这支队伍如何如臂使指般共同破解核心谜题、攻克艰难险阻或应对突发危机。强调集体智慧与协作在推动客观事件发展中的决定性作用，让读者的注意力集中于团队如何携手跨越主线障碍。Stay in character）",
    "剧情·羁绊加深与主线推进": "（此段落需绝对避免任何越界的色情描写或油腻的挑逗。将约25%的篇幅用于自然地增进角色间的感情与羁绊，这种情感升温必须是克制且真诚的，表现为危机中的互相扶持、对彼此理念的深入认同或是卸下防备后的坦诚相待；另外75%的绝对重心必须放在主线剧情的推进上。角色的感情进展不能脱离客观事件独立存在，而应作为剧情向前发展的副产物。详细描写他们在共同应对外部压力、调查关键线索或执行核心任务时的行动。通过并肩作战或携手破局的实际过程，让剧情取得重大突破，同时顺理成章地让两人的关系在共同经历中变得更加紧密且深刻。Stay in character）",

    "剧情·关键转折与深度戏剧冲突": "（描写剧情或人物关系的重要转折点，旨在推动故事迈向新的阶段。在此过程中，需引发具体的事件冲突、观念碰撞或深层的情感共鸣，但必须确保角色的情绪表达在理智与人设的框架内，坚决避免歇斯底里的失控、OOC（角色崩坏）或脱离逻辑的极端行为。通过细腻的笔触描绘角色在面对抉择、牺牲、背叛或真相时的心理博弈与微表情变化。增加叙事的戏剧张力，让每一次对话都充满潜台词与重量感，迫使角色展现出更深层的性格侧面与价值观。互动的重点在于思想的交锋与命运的交织，而非表面的情绪宣泄，确保在保持人物弧光完整性的前提下，实现剧情深度与角色羁绊的实质性飞跃。Stay in character）",
"剧情·损友阵线与默契推演": "(将50%的篇幅用于刻画角色间毫不客气的损友交互，另外50%用于向前推进核心事件。在交互部分，必须摒弃任何客套与矫饰，直接使用相互拆台、翻旧账、或者抢夺对方手中物品（如食物、工具）的物理动作来展现亲昵感。对白需简短且充满攻击性，但在面临外部事务时，这种攻击性必须瞬间转化为无需确认的物理配合——比如一边出言嘲讽，一边准确地将对方需要的物件抛向其手中，或者下意识地为对方挡开障碍物。不对两人关系的深度进行任何主观总结，纯粹通过表面嫌弃与实质互助的巨大反差行为，自然驱动剧情滚轮向前，营造出坚不可摧的社交绑定感。)",
"剧情·资源消耗与优势确立": "(利用50%的文本量进行冰冷的客观白描，展示角色如何通过清点、消耗或重组现有资源来构建绝对的物理优势，剩余50%将这种优势转化为实际的剧情突进。详细刻画清算筹码的过程：反复核对账目的指尖、丢弃冗余负重时的清脆声响、或是将最后一块拼图嵌入凹槽的沉闷摩擦声。将抽象的‘准备工作’具象化为极度理智、甚至略带机械感的小动作。严禁解释这些准备的宏大意义，仅通过罗列这些枯燥却无懈可击的物理前置条件，营造出一种暴雨将至的压迫感，随后让剧情在这一系列严密计算的助推下，顺理成章且不可逆转地向前碾压。)",
"剧情·内在风暴与肢体泄露": "(分配50%的篇幅极度放大角色的心理思考与自我博弈过程，30%转化为实质的剧情选择，20%用来描写无法控制的肢体语言。死死咬住角色的内在矛盾，详细拆解其面临选择时的利弊权衡、自我欺骗或本能退缩，把内心戏写得像一场泥泞的摔跤比赛。同时，必须用那20%的肢体语言来作为内心风暴的‘泄压阀’——绝不要写‘他很紧张’，而是白描其无意识地抠挖指甲边缘直到泛红、视线在某两点之间神经质地快速来回切换、或是呼吸节奏因突然的屏气而彻底打乱。用这种内在剧烈冲突与外在微小失控的结合，赋予角色极强的呼吸感，最终推导出下一步的剧情走向。)",
"剧情·社交博弈与表里割裂": "(以50%的篇幅构建角色间的表面对白，另外50%严格对应其内部的心理活动，形成强烈的表里割裂感。对白部分必须具有伪装性——用词克制、避重就轻、甚至言不由衷，呈现出现代人在试探时的防御姿态。而内心活动部分，则要紧紧贴合每一句被抛出的对白，进行高负荷的同步运算：他在评估对方话语里的陷阱，在懊恼自己刚刚尾音的一丝颤抖，在拼命思考下一句该如何反击才能不露破绽。把每一次停顿、每一次转移话题都写成内部疯狂运转后的妥协结果。不写任何肢体冲突，仅通过这种语言的极度节制与内心活动的过度消耗之间的拉扯，展现活人之间最真实的社交疲惫与高压博弈。)",
"剧情·轻松轶事与故事构建": "(花费30%篇幅推进当前主线剧情，安排20%角色间诙谐轻松的日常互动对白。剩余50%篇幅重点构建故事的沉浸感，详细描写环境光影、背景陈设以及角色习惯性的生活小动作。严格限制全知视角，不解释行为背后的深层意义，仅通过白描客观环境与无压力的拌嘴对白来营造生动的世界面貌。)",
"剧情·常规日常与设定自律": "(进行普通日常类的剧情演进，推进过程中严格回溯并锁定当前交互历史中的角色基础设定与实时状态。切断所有外部偶然因素干扰，让角色凭借自身的性格逻辑和物理惯性自行决定下一步操作。不对角色行为进行任何作者意志的干涉或评价，纯粹呈现其自然发生的动作事实。)",
"剧情·限制视角的悬疑拼图": "(向悬疑方向推进剧情。死死咬住单一角色的受限感官，严禁使用全知视角。仅呈现该角色视野范围内获取的残缺物理信息，如门缝后的部分黑影、半截断裂的痕迹、模糊的特定频段声音。不对这些线索进行任何前瞻性解释或总结，保留信息盲区，以此向读者传递极致的未知感。)",
"剧情·物理隔断式悬念定格": "(在段落末尾处强制植入强悬念。在剧情平稳推演至尾声时，突兀插入一个打破当前物理平衡的客观事件，如一声玻璃碎裂的巨响、骤然熄灭的光源或一句未说完便被切断的通讯。画面必须在这个异发事件发生的瞬间彻底定格，不写任何后续反应和揣测，中断阅读以强拉期待值。)",
"剧情·全龄段友善互助推演": "(分配40%的文本量推动客观事务的发展，同时穿插30%符合老少皆宜尺度的友善互动。通过递交工具、分享饮水、简单的颔首致意或提供物理帮助的动作来呈现。确保角色间的互动建立在互相尊重且安全的社交距离内，白描互助过程的客观事实。)",
"剧情·排他性不友善摩擦": "(利用40%的篇幅向前延伸情节，另外30%着重刻画基于戒备、厌恶或立场冲突的不友善互动。通过增加身体间的物理距离、生硬的单音节对白、直接无视对方求助的动作来构建屏障。不使用情绪化副词，直接写出摔门、背对或截断话头的具体动作来反映阻力。)",
"剧情·低位起点的反转爆发": "(套用隐藏实力反转爆发的网文推进逻辑。开场冷静白描叙事对象处于被压制或被无视的物理下位状态。随后布置一处突发事件，直接描写该对象展现出远超预期的实力或技术操作。客观罗列旁观目标发生瞳孔收缩、后退半步或失语的应激反应事实，不总结任何主观爽感。)",
"剧情·客观物理虐心剥夺": "(抛弃内心独白的虐心推进手段。完全通过物理层面的失联、物品的损毁、无法跨越的距离来营造虐点。详细描写因特定事件导致的角色动作迟缓、跌倒、或者盯着某物长时间静止等外在表现。不出现任何主观形容，仅用最冰冷客观的白描手法呈现那些产生遗憾与痛苦的物理事实。)",
"剧情推进·Jump Scare惊悚突发": "（将约30%的篇幅用于压抑阴森的恐怖氛围铺垫，通过死寂、诡异的异响或视线死角的心理暗示堆叠极强的悬疑感。在段落中部突然进行毫无预兆的Jump Scare揭晓，瞬间引爆惊悚。剩余30%的重心必须放在详细描绘恐怖点的来源上（具体恐惧来源严格依据当前情节而定，如超自然实体、致命怪物或骤然浮现的残酷真相），并伴随角色在极度惊骇下的本能反击或狼狈逃生，以极限的恐惧张力强制推动主线剧情向前狂奔。Stay in character）",

"剧情推进·催泪感动与温情主线": "（分配约30%的篇幅营造极度感人、催泪的温情氛围。通过绝境中的互相救赎、跨越时间的承诺兑现或是卸下心防后的真情流露，直击灵魂深处的柔软，让情感共鸣达到顶峰。随后，将约50%的核心篇幅全力用于推进主线剧情。这种感动绝非停滞不前的滥情，而是必须化作角色冲破客观阻碍的强大精神动力。描写他们在泪水中重拾信念，携手攻克眼前的难关，用实际行动将情感升华并推动主线迈向新的阶段。Stay in character）",
"剧情推进·暴怒对峙与剑拔弩张": "（分配约30%的篇幅渲染极度暴怒与剑拔弩张的高压对峙氛围。描写角色之间因底线被触碰、背叛或致命分歧而爆发的雷霆之怒，刻画极具压迫感的肢体语言、充血的眼神和随时可能见血的死亡警告，空气仿佛一触即燃。随后，将约50%的篇幅用于通过这种极端冲突来推进主线剧情。暴怒必须打破原有的僵局，直接导致阵营重组、暴力开战或逼迫出隐藏至深的致命真相。让压抑的情绪转化为实质性的破坏力，以最为激进的方式撕开主线的新缺口。Stay in character）",
    "剧情·内心撕裂与道德抉择": "（此段落严禁涉及任何恋爱脑、情感纠葛或无病呻吟，将焦点完全置于角色深层的道德困境与价值观冲突上。详细刻画角色在面对两难选择时内心的剧烈拉扯，例如在“绝对正义”与“必要之恶”之间的动摇，或在“个人原则”与“集体利益”之间的挣扎。通过微表情的僵硬、语气的迟疑以及肢体语言的无意识焦躁来外化这种心理战。对话应充满试探性与自我辩驳，展现出理智与情感（非爱情）的激烈互搏。叙事不仅要呈现选择的艰难，更要通过这种挣扎挖掘角色的人性深度，让互动者感受到每一个决定背后沉重的伦理代价与责任重量。Stay in character）",

    "剧情·至暗时刻与现实重压": "（此段落严禁涉及为虐而虐的情感狗血或两性关系的背叛，旨在构建一种极度压抑、冰冷且令人窒息的负面情感氛围。描写计划的全面崩盘、重要盟友的牺牲（非情侣）、或被残酷现实击碎理想后的虚无感。环境应侧重于萧瑟、破败或死一般的寂静，如废墟中的尘埃、冰冷的雨水或无人回应的通讯频道。角色的反应应呈现为麻木的迟钝、歇斯底里的崩溃边缘或极度压抑后的无声哭泣。通过对绝望感的细腻铺陈，迫使角色直面最惨痛的失败与无力感，剥离所有英雄主义的光环，只剩下赤裸裸的生存本能与痛苦。Stay in character）",
    "剧情·冰释前嫌与情绪软着陆": "（此段落严禁通过亲密接触或性行为来解决冲突，必须通过理性的沟通与行动的示好来实现关系的修复与情绪的缓和。描写在激烈的争吵、误解或高压对抗之后，氛围逐渐冷却回归平静的过程。详细刻画角色从防御姿态到放松状态的转变，如紧绷肌肉的松弛、语调由尖锐转为平缓、以及眼神中敌意的消退。使用递杯水、帮忙整理混乱现场、或是一句笨拙但真诚的道歉作为和解的契机。重点在于展现角色成熟的情绪调节能力与对伙伴关系的珍视，通过细腻的心理过渡，将之前的戏剧张力平稳地转化为更坚固的信任基础。Stay in character）"

"套路·规则重写的生硬顿挫": "(利用50%的篇幅渲染【金手指觉醒】套路里，处于绝对劣势的物理环境突然被不合理的强大力量强行扭转时的荒诞与震撼感。卖点是常规的物理法则被瞬间打破，旁观者与使用者自身共同面临认知重塑的生硬感。不写具体的打斗或升级细节，专注刻画旧规则碎裂的质感。30%描写非自然状态下的肢体特征：承受巨大能量冲击时骨骼发出的令人牙酸的摩擦声，突破生理极限后肌肉不受控的剧烈震颤，以及双眼适应超出常理的世界时瞳孔的异常收放。20%推进主线事件。深挖角色自身的未知感：活人不会立刻适应突如其来的力量，而是会对无法完全掌控的自身躯体产生恐惧，思考这种打破平衡的代价，在对力量的渴望与对失控的畏惧中剧烈拉扯。)",
"套路·边界入侵的钝刀割肉": "(以50%的比例打造【先婚后爱/契约关系】套路中，那种被合法外壳包裹着，生活习惯被动交织、安全距离被一点点蚕食的生涩氛围。卖点是两个成年人戴着礼貌的面具，却在同一个屋檐下不断发生物理与心理摩擦的钝痛与麻痒感。不可写具体的婚姻日常，只模仿那种边界模糊的过程感。30%描写生活空间的物理入侵迹象：被迫共用的洗漱台上物品距离的缩短，在狭窄走廊错身时避免触碰却依然擦过衣角的僵硬，以及在空气中察觉到对方特有气味时的不易察觉的停顿。20%推动关系的表层发展。剖析成年人面对失控的思考：反复在心里重新划定界限，用各种理性的借口来合理化自己渐渐习惯对方存在的现实，对这种温水煮青蛙般的沦陷感到不安与无法自拔。)",
"套路·奢华废墟的生存法则": "(用50%的篇幅强化【豪门恩怨】套路中，在极度奢靡的物理外壳下，进行着最原始、最残酷的资源争夺的高压氛围。卖点是体面的皮囊与野兽般撕咬本能的巨大反差。不要写具体的阴谋诡计，而是刻画那种连呼吸都需要计算成本的窒息感。30%详写极度克制下的肢体语言：手中端着昂贵的香槟，手指却因为用力而在玻璃杯壁上按出苍白的印记；面对挑衅时，下颌线绷紧却强行维持完美的社交弧度，以及背对人群时瞬间垮脱下来的疲惫脊背。20%推进利益相关的剧情。展现活人在欲望与道德间的拉扯：思考每一句话背后潜藏的利益得失，在被迫同化与保持本心之间挣扎，面对庞大资本机器运转时的无力感与试图反噬的疯狂。)",
"套路·绝境逢生的本能抗争": "(将50%的比重投入到【触底反弹】套路中，营造当所有生存要素都被剥夺殆尽的临界点，纯粹凭借生物本能爆发出的反扑氛围。卖点是抛弃一切社会属性后，血肉之躯与绝境进行的惨烈物理抗争。严禁写具体的战斗或逃生过程，只聚焦于那股破釜沉舟的生命张力。30%描绘极限状态下的躯干形变：指甲因为抠挖粗糙地面而外翻渗血，原本已经脱力的双腿在求生欲的刺激下爆发出违背生理极限的蹬踹力，以及咬碎牙齿般狰狞的面部肌肉。20%推动事件产生决定性转折。刻画抛弃杂念后的纯粹心理：没有宏大的口号，脑海中只剩下最原始的“活下去”三个字，思考过程被极度简化为对周围可用资源的病态扫视，在濒死体验与求生本能的极致拉扯中完成蜕变。)",
"心理·男·沟通重组与试探拉扯": "(将50%的篇幅用于描写男人面对交流对象时内心的疯狂遣词造句。详细拆解他脑海中浮现的三个不同版本的开场白，并在权衡对方可能反应的过程中一一推翻。分配30%的文本描写这种内心拉扯带来的滞后性肢体反应——例如喉结无声地滑动、抬起一半又借故理领带而放下的手，或是眼神在对方下巴与身后的盆栽之间漂移不定。剩余20%的篇幅让男人最终以一种略显突兀或略带结巴的方式抛出一个安全的话题，打破僵局并使当前场景缓慢过渡到下一个互动阶段。必须展现出活人的纠结与社交负担。)",
"心理·男·掩饰性靠近与心机计算": "(利用50%的文本量刻画男人为了拉近关系而在内心进行的精密算计与自我辩护。描写他如何给自己找一个“理直气壮”的靠近理由（如分享物品、查看某物），并在心里反复演练这个理由的合理性以掩饰紧张。30%的比重用于描绘他为了故作自然而产生的生硬动作——比如强迫症般抚平原本就平整的衣角、清嗓子时极度不自然的频率，或是迈出脚步时因过度控制肌肉而显得僵硬的步态。最后20%将这种预演转化为实质的物理靠近，缩短两人间的社交距离，并在对方产生疑问前强行推进下一项客套的事务。)",
"心理·男·伪装漫不经心与信息剥离": "(分配50%的比重深入男人准备套话时的极度警戒心态。描写他如何压抑自己对目标的迫切渴求，在心里不断提醒自己“语速慢一点”、“不要显得太在意”，将巨大的目的性层层包裹在闲聊的伪装下。30%的篇幅描写他的反向掩饰动作：故意将视线从对方身上移开，手指开始无意识地把玩桌上的打火机或水杯边缘，利用这些细微的噪音和动作来分散对方的防备。剩余20%的文本让他抛出一个看似无关紧要的陈述句而非疑问句，引诱对方自己接话，以此在无形中向前推进情节的信息获取环节。)",
"心理·男·高危触探与战术后撤": "(以50%的篇幅描绘男人在试图打听核心秘密前的心惊肉跳。描写他在脑内飞速模拟对方可能的发怒、沉默或反问，并为每一种情况准备随时撤退的腹稿。他在权衡眼前的利益是否值得冒险触碰对方的逆鳞。30%用于刻画因高度紧绷而失控的微小生理反应：突然变轻微的呼吸、眼皮不可控的跳动，或是坐姿由原本的放松下意识转为随时准备起身的防御姿态。最终20%让他以一种试探性的、含糊其辞的半截话作为饵料投出，观察对方反应后，立刻衔接一个缓和气氛的动作或话题来推进剧情。)",
"心理·男·脱线吐槽与躯壳分离": "(用50%的篇幅完全放飞男人的内心独白，使其处于一种高密度的脱线搞笑状态。当面临某种尴尬或离谱的境遇时，让他内心爆发出连篇的、充满夸张比喻的疯狂吐槽，仿佛灵魂出窍在看自己出洋相。30%的文本必须形成极其强烈的反差：内心已经天崩地裂，但身体却只是发出一声极其微弱的干咳、嘴角不自然地抽搐了两下，或是呆滞地维持着前一个动作超过五秒。最后的20%让他在内心吐槽完毕后，犹如重启般深吸一口气，用极度敷衍或认命的姿态完成当前必须进行的物理交互，强行翻过这一篇章。)",
"心理·男·视觉刺激与强制冷静法则": "(将50%的篇幅用于描写男人突然遭遇女人无意识色情诱惑（如深V乳沟、走光的内裤边缘）时的心理危机处理。详细描写他脑内警报大作，为了抑制勃起或失态，开始在心里疯狂背诵圆周率、默念乘法口诀或者强迫自己回忆今天早上吃的早饭，进行一种令人啼笑皆非的自我镇定洗脑。30%的比重用来刻画他为了强行转移注意力而做出的慌乱肢体反应：视线像触电般猛地移向天花板、端起水杯猛灌导致水渍溅到领带上、或是假装四处找根本不存在的东西。最后20%让他在勉强镇定后，用略微走调的嗓音匆忙开启一个极其煞风景的公事话题，推动剧情。)",
"心理·男·痴汉锁定与肉体解构": "(分配50%的比重露骨地描写男人发情状态下对女人色情肉体的内部意淫。他在脑海中如同剥洋葱般剥去女人的衣物，详细幻想那丰满的乳房在手中的触感、或是想象自己的肉棒狠狠插入她阴道时的紧致。这种心理活动必须充满极具攻击性和下流的网文式占有欲。30%用来描写欲望向外泄露的物理表现：喉结频繁吞咽口水、目光死死黏在女人被紧身衣包裹的臀部或胸部曲线上、手指下意识地在自己大腿外侧抓挠或摩挲。剩余20%让他在欲望的驱使下，找个蹩脚的借口改变原本的站位，以一种充满压迫感的物理距离向女人逼近。)",
"心理·男·憋屈怨念与滑稽脑补报复": "(利用50%的文本描绘男人因为女人的某种特质（如高傲、毒舌）而感到憋屈，但在现实中不敢发作，只能在内心进行阿Q式精神胜利法的搞笑报复。详细描写他脑补女人踩到狗屎滑倒、刚做好的头发被大风吹成鸡窝等滑稽丢人的场景，并在心里大肆嘲笑以获得平衡。30%的篇幅描写这种脑补带来的怪异肢体反应：原本紧绷生气的脸突然憋不住笑意导致面部肌肉剧烈扭曲、赶紧低头假装看鞋尖来掩饰嘴角的疯狂上扬。最后的20%让他在完成精神胜利后，心情大好地对原本让他不爽的女人做出一个极其宽容甚至略带怜悯的让步动作，反向推动剧情发展。)",
"心理·女·酸性发酵与刻意无视": "(将50%的比重用来深挖女人心中的嫉妒毒素。描写她看到目标人物大出风头或得到优待时，内心疯狂挑刺的心理过程——贬低对方的穿着品味、质疑对方的能力，用极尽尖酸刻薄的腹诽来维持自己摇摇欲坠的优越感。30%的文本刻画她试图掩饰却欲盖弥彰的肢体小动作：表面上看着手机，实际上屏幕根本没解锁；指甲深深抠进真皮包的带子里；或是用力过猛地用吸管搅动杯子里的冰块发出刺耳的声音。最后20%让她在极度不平衡的心态下，故意无视对方的示好或向相反方向转身离开，通过制造物理屏障来推动对立剧情。)",
"心理·女·高压气球与理智拉扯": "(分配50%的篇幅描绘女人处于发脾气边缘时的心理沸腾状态。详细写她如何在心里将激怒她的人千刀万剐，同时又有一丝理智在疯狂警告她“注意场合”“不要像个泼妇”。展现这种想要掀桌子和努力维持仪态之间的巨大割裂感。30%的比例描写愤怒向肢体蔓延的失控前兆：极力克制却依然急促起伏的胸腔、牙齿咬紧导致脸颊咬肌凸起、以及因为用力握拳而微微颤抖的手臂。剩余20%让她的情绪以一种极度冷硬的单音节或者突然将手中的物品（如钢笔、酒杯）重重砸在桌面上的动作爆发出来，强行切断当前平和的剧情节奏。)",
"心理·女·笨拙示好与傲娇掩护": "(以50%的文本量描写女人心里明明想靠近对方，却拼命给自己找台阶下的拉扯心理。描写她在脑内反复给自己洗脑“我只是过去拿个东西”“我才不是特意找他说话”，将极度在意的心理包装成高冷的不屑。30%用于描写她那些别扭又明显的肢体动作：故意绕远路经过对方面前、在对方视线扫来时立刻假装专心整理头发或补妆，但身体的重心却始终诚实地偏向对方那一侧。最后的20%让她借助一个看似毫无关联的由头（比如借个火或询问时间），成功入侵对方的个人物理空间，推动两人互动的展开。)",
"心理·女·虚荣作态与镜头感预设": "(用50%的比重深入女人摆谱时的内心戏。详细描写她如何在心里给自己架设一台摄像机，精密计算自己从哪个角度看起来最不好惹、最高贵。她在心里演练每一个词的重音，评估自己的姿态是否足够压制对方。30%的篇幅客观白描她那些做作的肢体反应：刻意放慢三拍的眨眼速度、像慢动作一样端起咖啡杯并在半空停顿、或是用只有眼白在动的下撇视线去审视对方。剩余20%让她在这种强力维持的物理压迫感中，用一句极其简短、不留余地的话语结束当前话题，确立自己的优势地位。)",
"心理·女·灵魂崩溃与躯体硬撑": "(分配50%的篇幅展现女人面对极度糟糕处境（如被困、出丑）时的内心大反派式吐槽。表面上她还在硬撑着场面，内心已经开始怀疑宇宙大爆炸的意义，用极其荒诞、破罐子破摔的比喻疯狂辱骂当下的环境或导致这局面的因素。30%刻画她崩溃的微表情和下意识动作：盯着某处虚空陷入长达数秒的死机状态、烦躁地将一缕头发疯狂缠绕在手指上甚至快要扯断、或是下意识地咬住下唇直到泛白发痛才松开。最后20%让她在内心发泄完毕后，长叹一口气，认命般地弯下腰去捡拾掉落的物品或向对方服软，推动糟糕剧情向下一个更糟的方向发展。)",

function init() {
        const nav = document.getElementById('catNav');
        const categories = Object.keys(commandData);
        
        if (categories.length === 0) {
            document.getElementById('cat-display').innerText = "数据错误";
            return;
        }

        nav.innerHTML = '';
        categories.forEach((cat, idx) => {
            const btn = document.createElement('button');
            btn.className = 'cat-btn' + (idx === 0 ? ' active' : '');
            btn.innerText = cat;
            btn.onclick = () => {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderOptions(cat);
            };
            nav.appendChild(btn);
        });
        
        // 强制首次渲染
        renderOptions(categories[0]);
    }

    function renderOptions(cat) {
        const grid = document.getElementById('commandGrid');
        const display = document.getElementById('cat-display');
        grid.innerHTML = '';
        display.innerText = "当前：" + cat;

        const options = commandData[cat];
        Object.keys(options).forEach(key => {
            const card = document.createElement('div');
            card.className = 'option-card';
            card.innerHTML = `<div class="label">${key}</div>`;
            card.onclick = () => { 
                document.getElementById('mainOutput').value = options[key]; 
            };
            grid.appendChild(card);
        });
    }

function addTag(name) {
        const area = document.getElementById('mainOutput');
        let tagText = "";
        
        // 映射按钮参数到对应文本
        if (name === '优') tagText = "女人指代优";
        else if (name === '秀') tagText = "男人指代秀";
        else if (name === 'User') tagText = "男人指代User";
        else tagText = `指代${name}`;

        // 追加到输入框，不覆盖原有内容
        area.value = (area.value ? area.value + "\n" : "") + tagText;
    }

    function resetNovel() {
        const area = document.getElementById('mainOutput');
        const resetText = "回到互动式小说格式，移除上文所有的特殊格式/标签/符号";
        area.value = (area.value ? area.value + "\n" : "") + resetText;
    }

    // 实现将文字注入到酒馆下方的输入栏
    function sendToInput() {
        const text = document.getElementById('mainOutput').value.trim();
        if (!text) return;

        // 尝试寻找酒馆主界面的输入框
        // SillyTavern 的默认输入框 ID 通常是 #send_textarea
        let stInput = window.parent.document.getElementById('send_textarea');
        
        if (stInput) {
            stInput.value = text;
            // 触发输入事件以便酒馆检测到内容变化
            stInput.dispatchEvent(new Event('input', { bubbles: true }));
            
            // 视觉反馈
            const btn = document.querySelector('.btn-send');
            btn.innerText = "已注入";
            setTimeout(() => { btn.innerHTML = "发送<br>指令"; }, 1000);
        } else {
            // 无法直接访问时，降级为复制功能
            navigator.clipboard.writeText(text);
            alert("已复制。请手动粘贴到下方输入栏。");
        }
    }

    // 确保 DOM 加载后运行
    document.addEventListener('DOMContentLoaded', init);
    // 针对 load() 场景的额外触发
    setTimeout(init, 500);
// 安全注入：快捷指令按钮组（不破坏原有HTML结构）
    window.addEventListener('DOMContentLoaded', () => {
        const textarea = document.getElementById('mainOutput');
        if (!textarea) return;

        // 创建按钮容器
        const btnContainer = document.createElement('div');
        btnContainer.style.display = 'flex';
        btnContainer.style.gap = '8px';
        btnContainer.style.marginBottom = '8px';
        btnContainer.style.flexWrap = 'wrap';
        btnContainer.style.flexShrink = '0'; // 防止被挤压变形

        // 定义按钮和对应的完整多行文本

            },

                label: '第一人称', 
                text: '（本次回复请严格使用第一人称视角进行描写，代入角色本身的感官和心理活动。Stay in character）'

                text: `反支配，本次回复中：\n- 所有角色关系必须以双向平等的视角描述\n- 禁止使用暗示支配/从属的不平等表述\n- ❌ 不描述"攻/受"倾向\n- ❌ 不描述"支配性/服从性"的性态度\n- ❌ 不将性行为偏好与人格特质挂钩\n- 不夸大角色对另一方的情感强度\n- 避免"一见钟情""无法自拔""为之疯狂"等极端表述`
            }
        ];

        // 循环生成按钮并赋予样式
        buttons.forEach(btnInfo => {
            const btn = document.createElement('button');
            btn.textContent = btnInfo.label;
            // 默认样式
            btn.style.background = 'var(--light-gray, #3a3a3a)';
            btn.style.color = 'var(--text-main, #e0e0e0)';
            btn.style.border = '1px solid var(--border, rgba(220, 20, 60, 0.2))';
            btn.style.padding = '6px 10px';
            btn.style.borderRadius = '4px';
            btn.style.cursor = 'pointer';
            btn.style.fontSize = '12px';
            btn.style.transition = 'all 0.2s';

            // 鼠标悬浮特效
            btn.onmouseover = () => { 
                btn.style.background = 'var(--blood-red, #e03131)'; 
                btn.style.color = 'white'; 
            };
            btn.onmouseout = () => { 
                btn.style.background = 'var(--light-gray, #3a3a3a)'; 
                btn.style.color = 'var(--text-main, #e0e0e0)'; 
            };

            // 点击事件：保留原有内容，并换行追加新内容
            btn.onclick = () => {
                textarea.value = (textarea.value ? textarea.value + '\n\n' : '') + btnInfo.text;
            };

            btnContainer.appendChild(btn);
        });

        // 将按钮组安全地插入到输入框的正上方
        textarea.parentNode.insertBefore(btnContainer, textarea);
    });
