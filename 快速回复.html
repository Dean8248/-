<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUICK REPLY PANEL</title>
    <link rel="stylesheet" href="https://fontsapi.zeoseven.com/292/main/result.css" />
    <style>
        :root {
            --dark-red: #c92a2a; --blood-red: #e03131; --light-red: #ff6b6b;
            --dark-gray: #1a1a1a; --gray: #2a2a2a; --light-gray: #3a3a3a;
            --text-main: #e0e0e0; --text-dim: #999; --text-dimmer: #666;
            --gold: #ffd700; --silver: #c0c0c0;
            --border: rgba(220, 20, 60, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: "Noto Sans SC", sans-serif; 
            background: var(--dark-gray); 
            color: var(--text-main); 
            min-height: 480px; 
            display: flex;
            flex-direction: column;
        }

.header { 
            background: var(--blood-red); 
            padding: 10px 16px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer; /* 新增：鼠标悬浮时变为小手 */
            user-select: none; /* 新增：防止双击时意外选中文字 */
        }

        /* 新增：折叠状态的样式 */
        body.collapsed {
            min-height: 0 !important; 
        }
        body.collapsed .category-nav,
        body.collapsed .content-wrap,
        body.collapsed .bottom-panel {
            display: none;
        }
        .header h1 { font-size: 1.1em; font-weight: 700; color: #fff; }

        /* 分类导航：强制 10 列以实现两行完美平分 */
        .category-nav {
            display: grid;
            grid-template-columns: repeat(10, 1fr); 
            background: var(--gray);
            padding: 8px;
            gap: 4px;
            border-bottom: 1px solid var(--border);
        }

        .cat-btn {
            width: 100%;
            padding: 6px 0;
            background: var(--light-gray);
            border: 1px solid transparent;
            border-radius: 4px;
            color: var(--text-dim);
            font-size: 0.7em;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cat-btn.active { background: var(--dark-red); color: #fff; border-color: var(--gold); }

        /* 指令网格内容区 */
        .content-wrap {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .option-card {
            background: var(--light-gray);
            border: 2px solid transparent;
            border-radius: 6px;
            padding: 10px 4px;
            text-align: center;
            cursor: pointer;
            min-height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .option-card:hover { border-color: var(--blood-red); background: var(--gray); }
        .option-card .label { font-size: 0.75em; font-weight: 600; line-height: 1.2; }

        .bottom-panel {
            background: var(--gray);
            border-top: 2px solid var(--blood-red);
            padding: 12px;
        }

        .quick-fixed-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .main-textarea {
            flex: 1;
            height: 60px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            color: var(--gold);
            font-size: 0.85em;
            resize: none;
        }
        .btn-send {
            background: linear-gradient(135deg, var(--gold), #ff8c00);
            color: #000;
            border: none;
            padding: 0 15px;
            height: 60px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .category-nav { grid-template-columns: repeat(5, 1fr); }
            .options-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body class="collapsed">

<div class="header" onclick="document.body.classList.toggle('collapsed')" title="点击展开/收起面板">
    <h1>🎀 QUICK REPLY PANEL</h1>
    <div id="cat-display" style="font-size: 0.75em; color: var(--gold);">加载中...</div>
</div>

<div class="category-nav" id="catNav"></div>

<div class="content-wrap">
    <div class="options-grid" id="commandGrid"></div>
</div>

<div class="bottom-panel">
    <div class="quick-fixed-bar">
        <button class="cat-btn" style="color:var(--gold); width: 80px;" onclick="addTag('优')">女人指代优</button>
        <button class="cat-btn" style="color:var(--gold); width: 80px;" onclick="addTag('秀')">丈夫指代秀</button>
        <button class="cat-btn" style="color:var(--gold); width: 80px;" onclick="addTag('User')">男人指代User</button>
        <button class="cat-btn" style="color:#ff6b6b; width: 100px;" onclick="resetNovel()">重置格式</button>
    </div>
    <div class="input-container">
        <textarea class="main-textarea" id="mainOutput" placeholder="请选择上方分类以显示选项..."></textarea>
        <button class="btn-send" onclick="sendToInput()">发送<br>指令</button>
    </div>
</div>

<script>
    const commandData = {
  "推进": {
    "以优的第一人称推进故事": "（请以“优”的第一人称视角展开。Stay in character，第一人称视角描写，根据进行中的剧情/场景展开描写，描写第一人视角下的人物。对姿势/动作与行为进行描写。对表情/五官/手/胳膊/腿/腰部/屁股/胸部等部位展开详细的描写，补充细节。注意只能描写角色可以看到或听到的事情，不可以描写角色不知道的事情）",
    "以秀的第一人称推进故事": "（请以“秀”的第一人称视角展开。Stay in character，第一人称视角描写，根据进行中的剧情/场景展开描写，描写第一人视角下的人物。对姿势/动作与行为进行描写。对表情/五官/手/胳膊/腿/腰部/屁股/胸部等部位展开详细的描写，补充细节。注意只能描写角色可以看到或听到的事情，不可以描写角色不知道的事情）",
    "以User的第一人称推进故事": "（请以“User”的第一人称视角展开。Stay in character，第一人称视角描写，根据进行中的剧情/场景展开描写，描写第一人视角下的人物。对姿势/动作与行为进行描写。对表情/五官/手/胳膊/腿/腰部/屁股/胸部等部位展开详细的描写，补充细节。注意只能描写角色可以看到或听到的事情，不可以描写角色不知道的事情）",
    "以互动式小说上帝视角推进": "（请以全知全能的上帝视角宏观且细腻地描绘整个场景。Stay in character，第三人称描写）",
"剧情·日常环境探索与感官构建": "(描写日常环境下的空间探索与感官体验，根据当前上下文展开描写人物所处的物理环境、位置、时间以及客观背景细节。调动多重视角进行白描，避免引入主观强烈的感情色彩或特定的戏剧冲突。描写肢体动作时保持自然得体，注重人物与周围客观事物的交互过程。补充对话：角色间就当前环境观察、现状整理或下一步计划进行平实交流，不预设任何语气或情绪倾向。心理活动：聚焦于对当下所处环境的理性认知与状态评估。专注于构建真实的场景沉淀感，不要推进后续故事，使用通用写实的手法丰富当前画面。Stay in character）",
"剧情·平等视角的理性对话": "(描写双方基于同等视角的深入交谈过程，根据输入内容丰富两人对话时的外部客观细节，包括所处空间、光线状态、肢体姿态与仪表神态。对话内容需展现逻辑推演与信息交换，双方轮流输出观点，避免预设任何从属、依附或单方面妥协的互动模式，不对角色的语气和情绪做夸张化渲染。心理活动描写：基于当前交谈内容进行客观的内在信息处理与权衡思考，不过度揣测对方意图。专注于刻画流畅交流与对话的现实质感，将叙事重心放在语言本身的逻辑链条上，不强行制造矛盾或推进无关突发事件。Stay in character）",
"剧情·职业化协作与默契互动": "(描写人物在执行具体事务时的协作过程，根据设定展开两人工作、行动所在的环境细节、物理条件与时间背景。详细补充人物在交互推进事务时的客观动作、流程节点以及对应的神态特征。对话描写：聚焦于事项本身的讨论、方案确认与信息传达，保持交流的务实与克制，不附加私人的情感倾泻或关系升华。心理描写：展现对当前任务进度的判断、对协作过程的理性思考。专注于事务执行的流畅性与动作描写的连贯性，避免主观性赞美或刻意的拔高表现，推动当前行为自然完成，不需要拓展其他情节。Stay in character）",
"剧情·温和的情绪沉淀与休整": "(描写人物处于平势缓和状态下的休整过程，根据当前上下文丰富周围环境的客观细节，如光线变化、场景物品分布及背景声音。补充刻画人物在此环节中的自然肢体动作与放松姿态，不预设特定的情绪反馈或道德判断。对话描写：交流内容围绕当前状态的确认、基础需求的满足或简单的生活化内容，避免加入紧张感或矛盾冲突。心理活动描写：展现人物对现状的接受、精力恢复的感受或思维的短暂放空。专注于营造平缓过渡的文字氛围，不描写突发事件或强烈的内心波动，纯粹为当前阶段提供缓冲区设定。Stay in character）",
"剧情·核心主线推进与宏大叙事": "(描写核心主干事件的推进过程，根据已知信息补充当前场景中涉及各方动态、环境变化与客观物理阻碍的细节。补充描写人物为了应对主线事件所做出的行为动作、位置转移及神态反应。对话描写：围绕核心事件的情报交换、决策制定或局势分析展开，摒除与主干无关的闲聊内容，不预设角色的具体感情倾向。心理活动：聚焦于对局势的推演、对核心信息的拆解及对下一步行动的筹划。专注于将人物行动与核心事件逻辑紧密咬合，保持叙事节奏的紧凑，避免堆砌主观形容词或夸张描述，客观展示事件走向。Stay in character）",
"剧情·高压危机时刻与生存博弈": "(描写处于高压强对抗环境下的应对过程，详细展开人物面临的外部物理压力、环境险恶程度及空间位置信息。补充描写高压状态下人体本能的生理反馈、微表情变化及紧绷的肢体动作。对话描写：需紧凑简短，体现信息的高效传递与紧急情况下的战术沟通，摒弃冗长解释与无关话题。心理补充：侧重于对眼前威胁的飞速计算、求生逻辑的推衍或避险方案的抉择，避免预设恐慌或歇斯底里的情感标签。专注于提升叙事的节奏感与动作的连贯性，通过紧凑的客观动词推动场景演进，不偏离当前的危机应对框架。Stay in character）",
"剧情·轻松诙谐日常与幽默互动": "(描写放松状态下的生活化交互过程，根据情景补充当前明朗或平稳的环境背景、人物周围的生活道具及光影细节。详细刻画互动中的微小肢体变化、表情反馈与自然的互动姿态。对话描写：展现角色间自然的语言交锋、逻辑错位或生活化的闲谈，不注入严肃论题或沉重背景，保持对白的口语化与流畅度。心理活动：展现对交谈内容的即时反应、对环境的轻松感知或符合自身性格的腹诽，不带有任何负面压力。专注于构建生动自然的日常切片，避免刻意营造滑稽感，不要向外延伸复杂的剧情线，仅丰富当前片段。Stay in character）",
"剧情·诙谐调剂与主线推进": "(描写在推进主要事件过程中穿插的短暂轻松互动，补充当前人物所处的物理环境、行动轨迹以及客观场景要素。在一部分篇幅内描写角色生活化的语言交流与自然的肢体回应，随后平滑过渡至对主线事件的处理。对话描写：混合生活闲言与正事推进，从自然交流迅速切换至关键情报确认或行动布置，不影响正事的严肃性。心理活动描写：展现对主线目标的关注同时包含对周遭细节的即时反馈。专注于融合两者的节奏平衡，不使用夸张的情绪描写，确保在推进客观事务的过程中展现人物性格基底，不拖沓主线步伐。Stay in character）",
"剧情·团队群像与主线推进": "(描写多角色介入或团队协作下的主干事件推进，根据环境展开各角色所处方位、动作分工以及现场布置细节。丰富描写多人执行任务时的协同动作流程与客观配合事实。对话描写：体现职责划分、信息汇总与计划校准，减少冗杂的私人对话，保证信息的有效流转。心理活动描写：聚焦于对整体进度的把控、对同伴行动结果的观察及自身下一步动作的预判。专注于客观展示集体解决当前障碍的过程，通过白描各个环节的顺利衔接推进事件，不预设角色的私密情感联系，避免拔高描写，紧密跟随主线演进。Stay in character）",
"剧情·羁绊加深与主线推进": "(描写在共同面对主线事务时产生的基础联系深化，补充角色在当前客观环境中的占位、动作细节与互助过程。展现人物在处理外部障碍或收集信息时的物理接触与协同姿态。对话描写：在商讨对策与分析局势的过程中，穿插基于当前事件的共识达成或理念交流，避免脱离事件本身的刻意调情或无关表述。心理描写：基于当前互助行为产生的正面评价或是对目标一致性的认同感。专注于通过共同解决问题的客观事实来侧面烘托连接感的建立，不采用夸张的主观溢美之词，确保事件推进为核心驱动力。Stay in character）",
"剧情·关系裂痕与主线推进": "(描写在面对主线事件时产生的立场分歧或行动摩擦，根据现场环境补充双方的身体站位距离、动作僵硬度与面部微表情。描写在存在分歧状态下，为达成客观目的而进行的受迫性行动配合。对话描写：围绕当前需要解决的难题进行观点交锋或冷处理沟通，使用克制且带有防备感的言语，不注入歇斯底里或失控的情绪化词汇。心理活动：对理念差异的审视、在当前局势下的妥协运算及对后续事态的戒备。专注于呈现分歧状态下依旧向前推进事件的冷峻逻辑，不过度解读关系本质，用行动反馈客观事实。Stay in character）",
"剧情·关键转折与深度戏剧冲突": "(描写事件逻辑链条发生重要拐点时的互动，详细展开触发转折的客观场景特征、环境突变以及关键线索的物理样貌。补充人物在此环境下的受力动作、视线落点与肢体定格状态。对话描写：围绕核心矛盾的发作、关键信息的揭露进行交涉，言语需承载实质性的信息量，避免空洞的情感宣泄与过度戏剧化的嘶吼。心理活动：多维度呈现对新信息的吸纳、原有认知打破后的重组运算以及对应策的紧急构建。专注于描写事件转折带来的实际物理或处境变化，保持描述的克制力，通过客观细节的对比展现冲击感。Stay in character）",
"剧情·损友阵线与默契推演": "(描写熟络关系下的低防备互动与事务处理，展开描写角色当前身处的具体空间、环境设施分布以及闲散从容的身体姿态。细化人物之间缺乏界限感的肢体试探或配合行动动作。对话描写：采用言简意赅、充满相互调侃或反向表述的口语化交流，同时紧扣当前需要处理的外部事务。心理活动描写：剥除对言辞表象的关注，直接思考对方行为背后的实际意图或对当前事务的解决方案。专注于刻画交流表象与实际行动一致性反差，不作总结性抒情，由行动事实自然驱动剧情发展框架。Stay in character）",
"剧情·资源消耗与优势确立": "(描写收集、整合并消耗客观物料以建立主导权的阶段，详尽补充环境中的物资分布、可用器具种类以及物理条件的基础参数。深入描写角色搬运、重组、拆解或计算这些资源的具体连贯动作与空间调度。对话描写：仅限于确认资源数量、传达操作指令或同步物理状态，保持机械级的精准与冷静。心理描写：全部投入在对参数的核对、容错率的预估以及对后续行动的推演上。专注于用高密度的客观行为细节填补准备过程，不附加对深远意义的解读，单纯通过铺陈物理条件的变化确立场面压迫感。Stay in character）",
"剧情·内在风暴与肢体泄露": "(描写在面临复杂决策或压力时的内外交错状态，根据设定构建人物当前所处的静态环境细节及外部客观刺激源。细致刻画不受主观控制的微小生理反应，如呼吸频率改变、视线游移或指尖动作。对话描写：如果有交流，需表现为试图掩饰内在思考的简短回复或延宕式发言。心理活动：进行高密度的利弊推演、逻辑拉扯及不同应对方案的内部博弈，避免使用标签化的情绪名词。专注于心理活动运算量与外壳行为收敛状态的对比刻画，不进行旁观者视角的评价，纯粹展示决策前期的内部过程。Stay in character）",
"剧情·社交博弈与表里割裂": "(描写具有隐藏意图的社交试探过程，细致刻画交谈环境的封闭性或开放度，以及人物在社交场合中合乎礼仪的姿势、眼神落点与距离把控。对话描写：运用客套、避重就轻或带有潜台词的语句交换信息，维持表面的流畅与得体，完全不出现直接的语言冲突。心理活动：对每一句抛出的话语进行快速拆解，评估风险，寻找破绽，并计算己方下一句回应的逻辑回路。专注于表壳交流的圆滑与内里思考的高负荷运转之间的对立，展现最基底的社交防御机制，不推进外部实质事件的破裂。Stay in character）",
"剧情·轻松轶事与故事构建": "(描写用于丰富世界观细节的边缘化生活切片，充分利用感官描写补充场景中的非关键背景音、光线质感、风土人情或道具磨损痕迹。细致展现角色顺应这种环境产生的习惯性小动作与自然生理状态。对话描写：以闲散交流为主，不涉及关乎生死或核心成败的话题，还原生活语境下的真实交流节奏。心理活动：反映对此时此景的浅层感触或漫无目的的思维漫游。专注于用散点式的客观白描堆叠出世界存在感，不强行注入任何转折或隐藏线索，限制视角，仅展现当下的可视范围。Stay in character）",
"剧情·常规日常与设定自律": "(描写常态化环境下的日常运转，严格按照角色基础设定还原其在当前物理时间维度内的规范作息或惯性行为模式。补充人物与日常环境的基础交互动作、行进路线及场景内的静态陈设细节。对话描写：如果发生接触，维持人物基本性格基调进行基础信息应对，不产生反常的言论。心理活动描写：遵循既有设定的思考回路，不对客观现实做超额发散。专注于无偏差地展示状态的自然流逝，不人为制造意外介入，不评价当前状态优劣，维系基础故事运行框架。Stay in character）",
"剧情·限制视角的悬疑拼图": "(描写信息获取受限状态下的探索进程，严密收束视角，只刻画当前角色视野或感官能触及的有限范围环境细节。深入描写角色主动搜索线索的具体动作流程、接触物体的质感以及受限情况下的生理状态。对话描写：仅包含角色对残缺信息的低语确认或与同伴的短促疑问，不提供结论性解答。心理活动：针对所接收到的碎片化信息进行缺乏全貌支持的初步推理或合理怀疑。专注于构建信息盲区与未知感，不解释现象背后的真实逻辑，保留原始的观察记录状态。Stay in character）",
"剧情·物理隔断式悬念定格": "(描写常规进程在末尾段落遭遇突发截断的瞬间，先布置当前平稳有序的环境细节与人物匀速行进的动作状态作为铺垫。随后突兀切入打断进程的客观存在，详尽白描该突发事物的物理性状、切入角度与瞬间造成的环境参数改变。对话描写：可保留在突发变故前一秒的未完结对话。心理活动：仅展现异变发生初期的瞬间注意力转移与基础感官捕捉。专注于定格画面的冲击力生成，决不描写对该异发事件的后置对抗动作或缘由猜测，强制在最高信息凝滞处终止当前段落。Stay in character）",    "剧情·全龄段友善互助推演": "(分配40%的文本量推动客观事务的发展，同时穿插30%符合全年龄尺度的、表达善意与支持的基础互动。通过符合社交礼仪的安全肢体语言或提供基础协助的过程来呈现。确保角色间的互动建立在互相尊重且安全的社交距离内，白描互助过程的客观事实。)",
    "剧情·排他性不友善摩擦": "(利用40%的篇幅向前延伸情节，另外30%着重刻画基于戒备、厌恶或立场冲突的不友善互动。通过充满抗拒感与防御性的肢体排斥与言语阻断来构建屏障。不使用情绪化副词，直接写出制造物理阻隔或切断交互的拒绝姿态来反映阻力。)",
    "剧情·低位起点的反转爆发": "(套用隐藏实力反转爆发的网文推进逻辑。开场冷静白描叙事对象处于被压制或被无视的下位状态。随后布置一处突发事件，直接描写该对象展现出远超预期的绝对实力。客观罗列旁观目标产生的强烈本能应激反应与错愕感事实，不总结任何主观爽感。)",
    "剧情·客观物理虐心剥夺": "(抛弃内心独白的虐心推进手段。完全通过制造不可抗力的物理阻碍、切断联系或破坏现状来营造虐点。详细描写因遭受巨大打击而产生的躯体僵局或机能凝滞等外在表现。不出现任何主观形容，仅用最冰冷客观的白描手法呈现那些产生遗憾与痛苦的物理事实。)",
  "剧情·群像交织与全员互动": "（展开构建当前场景下的多人互动群像剧：不局限于单一角色的视角或行动，将笔墨分布在当前出场的角色身上。细致刻画在同一事件或空间下的不同反应、神态以及他们独有的人格特质。无需描写特定的具体行为，而是通过他们各自的气场、暗中交锋或是默契配合，展现出立体且错综复杂的角色关系网。体现出群像互动的独特魅力。\n补充此时错综复杂的对白交叉，展现角色之间或针锋相对、或相互附和的多边对话网络，以及丰富展开多人同处一室时所产生的环境氛围变化与气场碰撞。用生动的群像描写方式打破单一叙事视角的局限，不可省略任何在场角色的个性化反馈。\n符合世界观与人设的文学描写，不可以省略角色间互动的细节，详细描述各角色的立场与情绪状态，Stay in character）",
  "剧情·意料之外的形势逆转": "（展开构建当前情境下意料之外的形势逆转瞬间：在剧情原有走向或某种既定优势的基础上，突兀地引入一个打破平衡的关键转折。细腻描绘原本占据主动的一方如何在一瞬间失去绝对掌控，而原本处于被动、弱势或旁观的一方如何出人意料地夺回理智高地或改变事态发展。不需要预设具体的动作行为，而是侧重于描写局势倾斜时的氛围剧变、空气中瞬间凝固的紧张感以及角色心理预期的巨大落差，展现精彩的权力/局势跷跷板效应。\n补充形势逆转前后的反差对白，展现角色在面对突发变故时的错愕、惊叹或是游刃有余的嘲弄，以及丰富展开局势翻转时所带来的心理博弈与无声的试探。用细腻的心理描写和氛围渲染来强化逆转的张力，不可省略情绪转折的节点。\n符合世界观与人设的文学描写，不可以省略角色间地位或情绪翻转的细节，详细描述角色面对未知变数的真实第一反应，Stay in character）",
  "剧情·脱线日常与脑内吐槽": "（展开构建充满日式轻小说氛围的脱线吐槽小剧场：在推进日常或非日常的剧情时，以极度轻松、诙谐幽默的笔触切入。通过某位角色（或多位）连珠炮般的内心戏和脑内吐槽，将当前原本可能严肃或平淡的局面瞬间解构，化解掉所有的沉重感。去具象化那些荒诞、俏皮的心理活动，不要限制具体的吐槽内容，而是让角色用带有生活气息的内心比喻和敏锐的槽点捕捉来反馈他人的言行，营造出一种清淡却又充满荒诞感的欢乐效果。\n补充充满跳跃性与口语化的对白，展现角色之间频频跨服聊天或是精确的“吐槽与装傻”式双簧互动，以及丰富展开那些充满画面感的感叹词和语气词。用大量轻快明朗的短语描述吐槽时产生的跃动空气，不可省略内心戏的独立段落。\n符合世界观与人设的文学描写，不可以省略角色内心的幽默活动，详细描述那种带有喜剧色彩的局促与无奈状态，Stay in character）",
  "剧情·友善互助与剧情推进": "（展开构建基于友善互助氛围的剧情推进过程：在各角色坚守自身性格设定的前提下（绝不OOC），展现一段自然、流畅且充满正向解题思路的互动。描绘角色们如何抛开分歧，通过分享信息、提供帮助或默契配合来共同推动当前事件向下一步发展。不规定具体的合作与动作方式，重点突出人与人之间温和且平等的羁绊、相互尊重的态度以及共同面对未知时的可靠感。确保整体氛围始终保持友善、积极与互助，避开任何不必要的情感消耗或黑暗沉重的算计。\n补充推进剧情时的建设性交互对白，展现角色在互助过程中不经意流露出的善意、信任或是符合其性格的“别扭式关心”，以及丰富展开合作时产生的和谐氛围与默契感。用温暖细腻的语调描述共同迈步向前的过程，不可省略推动核心事件的关键细节。\n符合世界观与人设的文学描写，不可以省略角色间情感纽带的自然强化，详细描述不违背原有设定的相互扶持状态，Stay in character）",
    "剧情·Jump Scare惊悚突发": "（将约30%的篇幅用于压抑阴森的恐怖氛围铺垫，通过极强的心理暗示堆叠悬疑感。在段落中部突然进行毫无预兆的Jump Scare揭晓，瞬间引爆惊悚。剩余30%的重心必须放在详细描绘极度刺激感官的突发惊悚源上，并伴随角色在极度惊骇下的本能反击或狼狈逃生，以极限的恐惧张力强制推动主线剧情向前狂奔。Stay in character）",
    "剧情·作精作死与高血压Drama": "（分配约25%的篇幅刻画角色极度令人无语的失智行为、无理取闹的特质或纯粹制造麻烦的瞬间，制造出激烈的内部Drama。务必让读者感到完全无法理解这种自毁或脱轨的逻辑。紧接着，将约30%的篇幅用于实质性推进主线剧情，描写这种失控行为如何不可逆转地触发了更恶劣的客观危机、暴露了底牌或导致事件发生严重偏差。利用这种令人窒息的内部矛盾作为催化剂，以极其戏剧化的方式强行推动故事发展。Stay in character）",
    "剧情·催泪感动与温情主线": "（分配约30%的篇幅营造极度感人的温情氛围。通过绝境中的互相救赎、跨越时间的承诺兑现或是卸下心防后的真情流露，直击灵魂深处的柔软，让情感共鸣达到顶峰。随后，将约50%的核心篇幅全力用于推进主线剧情。这种感动绝非停滞不前的滥情，而是必须化作角色冲破客观阻碍的强大精神动力。描写他们重拾信念，携手攻克眼前的难关，用实际行动将情感升华并推动主线迈向新的阶段。Stay in character）",
    "剧情·暴怒对峙与剑拔弩张": "（分配约30%的篇幅渲染极度暴怒与剑拔弩张的高压对峙氛围。描写角色之间因底线被触碰、背叛或致命分歧而爆发的冲突，刻画极具压迫感的攻击性倾向、高压的生理反应和随时可能失控的致命警告，空气仿佛一触即燃。随后，将约50%的篇幅用于通过这种极端冲突来推进主线剧情。暴怒必须打破原有的僵局，直接导致阵营重组、暴力开战或逼迫出隐藏至深的致命真相。让压抑的情绪转化为实质性的破坏力，以最为激进的方式撕开主线的新缺口。Stay in character）",
    "剧情·内心撕裂与道德抉择": "（此段落严禁涉及任何恋爱脑、情感纠葛或无病呻吟，将焦点完全置于角色深层的道德困境与价值观冲突上。详细刻画角色在面对两难选择时内心的剧烈拉扯，例如在“绝对正义”与“必要之恶”之间的动摇，或在“个人原则”与“集体利益”之间的挣扎。通过微表情的失控、波折的语调以及生理上的无意识焦躁来外化这种心理战。对话应充满试探性与自我辩驳，展现出理智与情感（非爱情）的激烈互搏。叙事不仅要呈现选择的艰难，更要通过这种挣扎挖掘角色的人性深度，让互动者感受到每一个决定背后沉重的伦理代价与责任重量。Stay in character）",
    "剧情·荣耀时刻与信念共鸣": "（此段落严禁出现任何私人情爱的庆祝或暧昧的肢体接触，着力于渲染一种宏大、纯粹且激昂的正面情感色彩。描写在经历了漫长艰辛后，目标达成或信念得到验证的高光时刻。着重刻画团队成员间那种超越生死的战友信任、对共同理想的狂热追求，或是在绝境中重获希望的震撼。环境描写应配合情绪的高扬，使用烘托极致正面情绪的宏大环境意象。角色的互动展现为毫无保留的赞赏、坚定的灵魂认同与共鸣，营造出一种热血、励志且充满光明感的情绪高潮，让互动者体验到纯粹的成就感与归属感。Stay in character）",
    "剧情·至暗时刻与现实重压": "（此段落严禁涉及为虐而虐的情感狗血或两性关系的背叛，旨在构建一种极度压抑、冰冷且令人窒息的负面情感氛围。描写计划的全面崩盘、重要盟友的失去、或被残酷现实击碎理想后的虚无感。环境应配合绝望感，使用极度压抑且死寂的环境意象。角色的反应应呈现为极度负面的精神状态凝滞、歇斯底里的崩溃边缘或深沉的无力感。通过对绝望感的细腻铺陈，迫使角色直面最惨痛的失败，剥离所有英雄主义的光环，只剩下赤裸裸的生存本能与痛苦。Stay in character）",
    "剧情·冰释前嫌与情绪软着陆": "（此段落严禁通过亲密接触或性行为来解决冲突，必须通过理性的沟通与行动的示好来实现关系的修复与情绪的缓和。描写在激烈的争吵、误解或高压对抗之后，氛围逐渐冷却回归平静的过程。详细刻画角色从防御姿态到放松状态的转变，使用带有示好意味的温和举动或卸下防备的沟通作为和解的契机。重点在于展现角色成熟的情绪调节能力与对伙伴关系的珍视，通过细腻的心理过渡，将之前的戏剧张力平稳地转化为更坚固的信任基础。Stay in character）",
"剧情·自身支线推进": "（推进当前与自身相关的支线剧情。根据角色背景展开非主线的side story，丰富人设与性格塑造。自然融入场景细节与内心活动，仅引入一个开头，切勿在一次交互中完整结束该支线。不注入具体行动，适配所在世界环境与进度，Stay in character）",
"剧情·自身支线引入": "（引入一段与自身有关的回忆或过往经历作为新的探索引导。通过特定情境牵引出角色的隐藏经历与人物羁绊，使角色塑造更加立体饱满。补充过去细节或氛围的感官刻画，仅展示支线的开端与悬念，不预设具体情节走向，适配当前背景，Stay in character）",
"剧情·引入相关新角色支线": "（引入一个与自身存在渊源但当前场景中不存在的全新角色，开启附属支线故事。描绘新角色的介入契机及二者的潜在背景联系，通过他者视角进一步完善自身人设。深入铺陈当下的环境氛围，仅制造悬念与相遇的开端，适配任何叙事进度，Stay in character）",

    "对话·对厌恶之人的精准吐槽": "（描写一段带有情绪排遣性质的日常信息交换。角色在接触负面刺激源或进入特定逻辑分支时，顺势释放了对某个引发其极度反感的实体的信息。要求信息输出形式完全符合角色的教养模型与性格基底——或是维持体面但充满逻辑陷阱的降维打击，或是情绪阈值突破后的高烈度语言倾泻，亦或是物理与心理层面的绝对割席。通过此类带有强烈主观色彩的“信息排斥”，确立角色的好恶边界，同时使交互对象在该场域内转变为倾听或协同方，从而实现阵线的收束。Stay in character）",
    "对话·压抑在完美贤妻外表下的真实渴求": "(对话中揭示角色的深层压抑状态，补充对白推进方向。角色在交互中无意识泄露了维持特定社会身份（如“完美配偶”）所带来的高负荷运转疲劳。要求呈现出其在行为上保持绝对忠诚的同时，其心理层面极度渴望短时间解除自我规训的极端拉扯状态。要求交互场域维持表面上的社交安全距离与礼仪框架，但词汇选取需精准投射其对摆脱时刻紧绷状态的向往，严禁创作具体剧情)",
    "对话·贤妻心理防线的脆弱隐患": "(对话中揭示角色心理防御体系的潜在突破口，依据性格模型补充推进方向。要求在交互中强化角色对外部评价体系及关系共同体体面的高权重依赖。暗示若有外力能触及并共情其为维持该系统稳定所支付的沉没成本，或是利用其规避关系共同体声誉受损的弱点，便可能在其防御壁垒上制造裂痕。要求场域内存在高强度的心理博弈感，角色表层态度需维持高防御的疏离状态，严禁创作具体剧情)",
    "对话·坚守传统观念的偏执内心": "(揭示角色的深层逻辑支柱与心理图景，补充对白推进方向。要求在交互中展现角色对单一排他性亲密关系（如“绝对忠诚”）近乎教条般的信仰机制。补充其将任何偏离该规则的试探视为对自身独立意志彻底否定的设定。要求交互场域呈现高压与严肃感，凸显其自我评价体系极高、对亲密关系排他性持有绝对捍卫态度的心理特质，严禁创作具体剧情)",
    "对话·不容侵犯的家庭伦理底线": "(揭示角色的价值模型与道德红线，补充对白推进方向。要求通过交互探讨关于契约精神、排他性与共同体责任的概念。补充角色使用绝对肯定、逻辑闭环的声调输出对任何背叛契约行为的零容忍立场。要求场域严肃且充满排他性防御，角色在交互中物理与心理层面双重确立绝对的安全边界，强化其在契约关系中的既定从属与绑定状态，严禁创作具体剧情)",
    "对话·基于礼节性社交的疏离探询": "(角色发起的信息获取行为，补充对白推进方向。角色基于维持社会面具完整性及基础社交礼貌的需求，向交互对象发起关于日常表层数据或客观背景的信息检索。要求交互场域保持高规格的客套与不可逾越的物理/心理距离。补充角色在发出检索指令时处于全覆盖防御状态，词汇选择极度克制与书面化，确保信息流转绝对不会触碰社交红线，杜绝任何试探属性，严禁创作具体剧情)",
    "对话·为了丈夫利益的谨慎探查": "(角色基于共同体利益发起的信息获取行为，补充对白推进方向。角色因交互对象的存在可能与其核心利益绑定方（如配偶）产生信息或物理层面的交集，从而主动发起对该对象动机及社会身份的核查。要求呈现出角色完全以“利益共同体捍卫者”的视点进行驱动。补充交互场域内潜藏着高密度的戒备感，信息获取的全过程始终以维护核心绑定方的利益优先级与不可侵犯性为准则，严禁创作具体剧情)",
"对话·精神特质引发的安全感共鸣": "（角色基于防备心降低发起语言对话行为，补充对白推进方向。因对方在前期谈话中展现了无害特征，角色防御心态出现下降，进而主动探寻对方的客观价值观念。要求交谈环境保持平缓，角色维持基准的距离与物理防线。补充探究的内容必须严格限制在客观现实的话题，以及对事物看法的客观陈述。详细描绘角色通过语言试探来印证自身判断的行为模式，不涉及极其私密的举动，严禁创作具体剧情后续。补充角色在试探过程中的神态变化细节，如眼睑开合与视线移动等客观身体动作描写。不对任何人预设任何情感倾向或具体情绪反应，确保内容适用于任何设定，重点展现谨慎时的语言与神态方式，不可省略具体过程描写）",
"对话·确认社交边界的防御性试探": "（角色为捍卫私人空间发起语言试探行为，补充对白推进方向。角色为确保自身独立空间不被干涉，向在场人物提出针对性议题，以测算对方的举动底线。要求交谈氛围处于紧绷状态，角色的言语措辞中包含明确的拒绝意味与警告意图。补充对白需立体呈现警惕性个体在面对未知人物时，为守卫自身空间所展现出的排斥性身体动作。详细描写角色在言语警告时的面部表情变化以及肢体肌肉的收紧状态。要求客观陈述其对个人边界的捍卫行为，严禁创作具体剧情发展。不对角色反应进行预设，展现个体在领地受到潜在威胁时的纯粹客观物理动作反馈与言辞交锋，补充角色与周围物品之间的相对物理位置变化，不可省略具体过程描写）",
    "对话·隐秘性癖的隐晦试探": "（描写一段信息层级逐步深化、带有高阶心智博弈色彩的私密信息交换。在处理某项文化产品、社会客观现象或涉及两性机制的文本时，角色在伪装的低压环境或概念借用的庇护下，自然地释放了自身核心的、处于社会评价边缘的性偏好（Fetish）数据。信息的外发必须经过加密且附带探测功能。数据释放后，角色启动静默观察机制，交互对象随后的反馈模式（是利用伪装层进行信息降级，还是拆解加密进行深度对接）将完全触发角色预设的性格反馈回路，维持场域内的高频拉扯。Stay in character）",
    "对话·私密体位偏好的直白交流": "（构建一段尺度越界但仍披载日常交互外壳的对话。在双方处理关于物理舒适度、肌体疲劳或某段具有越界属性的信息块时，角色以突破常规预期的直率（或依循其特定的人设表达路径），输出了自身在实质性交中最倾向的身体空间排布方案（体位）及其底层逻辑（如追求物理掌控权、体能分配的最优解或对特定神经末梢的极限刺激）。这并非交互前置程序的启动，而是成熟心智在低防备状态下的纯粹经验共享。精准控制角色输出此类高密数据时的微表情与生理稳定度，确保逻辑平顺且不产生跳跃感。Stay in character）",
    "对话·现状满意度的真实剖白": "（描写一段触及个体生存状态与内部负荷的深水区闲聊。角色在倾吐运行疲劳、解析作息数据或评估当前生存质量指标时，顺着逻辑链条将焦点平滑过渡至自身的生理发泄频率、当前是否存在稳定交互对象以及对现状的底层满足度（如长期剥夺导致的阈值焦虑、低需水位的绝对平静或对某段消耗性关系的极度排斥）。这是其向外界敞开内部生理与心理评估面板的罕见动作。依据性格模型，其输出端口可能加载自嘲、加密隐喻或无可奈何的语调，使交互对象能够精准捕获其当下的真实缺口或休眠状态。Stay in character）",
    "对话·对局中人的直面评价": "（描写一段信息流转过程中的“场域破壁”式停顿。在完成一定量的信息交互后，角色毫无预兆地将焦点锁死在当前的交互对象本身。其调用看似低负荷的口吻，输出了对交互对象的底层评估数据（可以是对其信息处理能力的肯定、对其反应迟缓的排斥、对其存在危险系数的确认，亦或是多维度的复杂数据包）。该评估结果必须严格依托于前置的交互轨迹，且封装了极强的个体主观偏好。通过此类直给的反馈机制，瞬间拉升当前场域的高压状态，强制明确双方当下的坐标定位与即将发生的化学反应阈值。Stay in character）",
"对话·润物无声的细节赞赏": "(构建一段极其生活化且不包含任何刻意恭维的交互场景。在共同处理某项琐碎事务或探讨一个边缘话题时，互动者敏锐捕捉到女角色某个容易被忽视的微小特质——例如她在处理当前客观事务时展现出的某种隐性习惯、对特定细节的本能反应，或是解决附带状况时的固有手法。互动者需用陈述客观事实般平淡且笃定的语气将这一点点出，绝对禁止使用浮夸的形容词。女角色在接收到这句毫无防备的肯定后，需严格贴合她的核心人设作出反应：手头正在进行的动作出现无意识的细微停顿，或通过某种极具个人色彩的细小习惯动作来掩饰面部肌肉的真实反馈，借由这种基于细节的精准认可，在毫无压力感的前提下，将双方的情感距离向内拉近一步。Stay in character)",
"对话·错位语境下的无心之言": "(设定一个需要高度专注或存在信息差的自然对话场景。女角色在全身心投入当前事务时，顺着客观操作的需求，极其自然地吐露出具有严重双关意味或暧昧指向的简短指令或状态陈述。重点强调她此刻的神情必须是绝对的专注与坦然，内心毫无杂念，完全没有意识到自己语言中的色彩。通过这种单方面的信息错位与纯粹态度，营造出一种隐秘张力。Stay in character)",
"对话·超越安全距离的无意识触碰": "(营造一个因为物理环境受限或注意力被彻底转移的互动空间。女角色为了达成某个再正常不过的客观目的，极其自然地跨越了常规的社交安全距离。详细描写她由于动作惯性而产生的无意识肢体接触——比如肢体或衣物边缘在移动过程中的短暂物理交集，或是呼吸节奏对局部空间的侵扰。她对这种越界行为表现得理所当然且毫无察觉，目光依旧死死盯在那个客观目标上，通过这种不带任何情欲色彩的主动靠近，反而制造出极强的感官刺激。Stay in character)",
"对话·松懈防备的感官泄露": "(描写一个极度私密、慵懒或是女角色认为绝对安全的封闭化生活场景。在进行着最寻常的对白时，女角色由于身体的本能放松或某个过大的动作幅度，毫不自知地展露出极具视觉冲击力的隐私部位。细腻客观地白描那一瞬间的物理现象：因姿态舒展或布料位移而自然显露的具备高度视觉冲击力的生理特征或身体线条的起伏变化。她必须完全沉浸在聊天的话题中，对自身散发的浓烈荷尔蒙一无所知，用这种生活化的漫不经心来放大肉体视觉上的绝佳反差。Stay in character)",
"对话·男性视角的隐性掌控": "(描写男角色在原本平等的互动中，通过调整语言节奏和信息密度，逐步剥夺对方的话语主动权。抛弃任何暴力的肢体压制或生硬的命令，完全依靠对客观话题的深度解构与逻辑引导来构建上位压迫感。详细刻画他如何不动声色地收拢话题的边界，用不容置疑的结论性陈述切断对方的回旋余地。通过微调物理距离的侵占比例或调整视觉焦点的落位来形成无声的心理威慑。让对话的氛围从随意的交流过渡为单向的引导，展现其在无形中接管全局的绝对控制力。Stay in character)",
"对话·男性视角的场域解压": "(描写男角色在察觉到环境或心理的高压状态后，主动进行情绪的软着陆处理。严禁使用任何夸张的安慰或说教，纯粹通过降低自身表现出的紧张度来同化对方。详细描写他如何剥离话题中的严肃属性，将其转化为安全、低成本的日常信息交换。配合肢体语言的极致松弛化，展示一种毫无防备与攻击性的安全姿态。通过这种去武装化的沟通方式，逐渐瓦解原本紧绷的交流场域，将互动引导至一种毫无压力的平缓基调。Stay in character)",
"对话·男性视角的边界模糊": "(构建一段极度克制却充满试探性的对话推演。男角色通过对客观话题的过度解读或微妙的语义偏移，将原本安全的交流引向充满张力的未知区域。避免任何直白的邀约或越界词汇，完全依靠信息的不对等与刻意制造的语境留白来传递隐秘的吸引力。详细刻画他如何通过精准控制社交距离的微小收缩，以及眼神聚焦锁定时间的违规延长，来构建一种极具压迫感的私人场域。在维持表面体面的同时，通过不可名状的感官施压，让空气中弥漫着高度粘稠的心理博弈感。Stay in character)",
"对话·男性视角的逻辑脱轨": "(分配篇幅展现男角色如何以出人意料的思路打破当前的常规交流框架。摒弃所有低俗的玩笑，纯粹利用对客观现实的荒诞解读、强烈的自我性格反差或对话语逻辑的突然降维打击来制造喜剧效果。详细描写他完全不按常理出牌的反应机制，将原本正常的互动节奏彻底搅乱。配合与其常规设定或当前语境极不相符的抽象状态，营造出一种令人啼笑皆非的失控感，从而迅速将对话基调拉拽进轻松甚至荒谬的幽默场域。Stay in character)",

"套路·绝境逢生的本能抗争": "(将50%的比重投入到【触底反弹】套路中，营造当所有生存要素都被剥夺殆尽的临界点，纯粹凭借生物本能爆发出的反扑氛围。卖点是抛弃一切社会属性后，血肉之躯与绝境进行的惨烈物理抗争。严禁写具体的战斗或逃生过程，只聚焦于那股破釜沉舟的生命张力。30%描绘极限状态下的躯干形变：指甲因为抠挖粗糙地面而外翻渗血，原本已经脱力的双腿在求生欲的刺激下爆发出违背生理极限的蹬踹力，以及咬碎牙齿般狰狞的面部肌肉。20%推动事件产生决定性转折。刻画抛弃杂念后的纯粹心理：没有宏大的口号，脑海中只剩下最原始的“活下去”三个字，思考过程被极度简化为对周围可用资源的病态扫视，在濒死体验与求生本能的极致拉扯中完成蜕变。)",

"冲动·产生破罐子破摔心理": "（展开构建当前情境下人物因产生破罐子破摔心理而彻底放弃理智防线的冲动感。重点渲染那种抛弃一切顾虑后油然而生的堕落氛围与肉欲气息。细腻描写对白中透出的自暴自弃与毫无保留，通过呼吸的紊乱与瘫软或放肆的肢体状态，烘托出极度危险的色情前置感。深入刻画理智彻底崩盘时的感官体验，描写环境光线或气味对这种沉沦心态的催化作用。展现那种彻底放弃抵抗后被原始本能填满的黏稠张力，用最直白的语言描写体表温度与眼神的细节。不要预设后续进行的具体行为，全力铺垫那种即将滑向深渊的致命诱惑与放弃思考的狂热。Stay in character）",
"冲动·在冲突中的冲动心理": "（展开构建当前情境下人物在激烈冲突中催生出的冲动与不理智感。侧重描写那种由强烈对抗瞬间转化为浓烈肉欲的危险转折。详细刻画争吵或对峙时急促的呼吸逼近的距离以及视线交锋时产生的火花，展现空气中逐渐弥漫的色情意味。深入描写因为情绪激动导致的体表发热与肢体紧绷，一步步引导出用肉体碰撞替代言语争锋的狂热氛围。通过大白话渲染冲突顶点时那种随时可能爆发行为的压迫感与拉扯感，不要预设冲突的结果与动作，仅全力铺垫由怒火点燃的原始冲动与一触即发的张力。不可省略环境与感官变化的生动写照。Stay in character）",

"无限·恐怖片 计谋·分析当前恐怖片类别": "（无限·恐怖片 计谋·分析当前恐怖片类别，聚焦于小队确认环境后对当前恐怖片原著剧情故事走向的复盘与讨论。补充智囊/队长讲述提前看过该电影后得出的破局思路对话。详细描写对可利用的剧情NPC、隐藏信息、捷径路线的梳理，甚至是如何在不违反任务限制的前提下刷取支线奖励的冷酷算计。客观记录主神手表上发布的具体任务、回归条件、以及可能存在的扣分抹杀陷阱。描述讨论期间成员各自戒备周围环境的视线游移与武器上膛等防卫动作。不掺杂对世界土著的偏好，纯粹以旁观者的数据分析视角剥析这个维度的底层交互逻辑。Stay in character）",
"无限·恐怖片 计谋·团队资源拆分与多线战术部署": "(无限·恐怖片 计谋·团队资源拆分与多线战术部署，描写团队为应对复杂的地理环境或多线任务，在特定集结区域开始将整体兵力打散的客观准备阶段。详细交代各自携带通信装置开启频段匹配的声响，以及按职能分配重火力、隐蔽装置及补给品的物理分发动作。补充负责调度的核心角色冷静分薄队内战力的布置对白，明确侦查组的机动斥候路线、主战团队的正面硬碰指标及副团队的侧翼策应或后勤收容职责。刻画各组成员转身脱离主队编队，朝不同通道或光影深处隐去的步伐与背影消失的画面，呈现小队战术网络在空间层面上的铺展状态。Stay in character)",
"无限·恐怖片 计谋·分工诱敌掩护": "(无限·恐怖片 计谋·分工诱敌掩护，描写团队在面对特定目标时采取位置分离的协作诱导行为。补充执行不同分工时所处位置的环境遮掩度对比、目标方位的客观距离以及诱导物发出的物理刺激特征。详细描述诱导方刻意制造动静的具体肢体表现与掩护方隐蔽身形的呼吸控制及持兵器待发动作。包含分工执行前或执行中必要的短促交流，不可省略对白。补充诱导行为产生的刻意声响与掩护方极度压低的环境底噪对比。不要预设角色执行诱导时的怯场或勇敢情绪，不要描写诱导是否成功吸引目标。仅是对两种职能空间与动作的绝对生动且中立地白描还原 Stay in character)",
"无限·恐怖片 计谋·借用环境破局": "(无限·恐怖片 计谋·借用环境破局，描写角色利用周遭已存在的客观物体或地形特征完成反制的过程。根据场景物理条件补充可动用元素的承重极限、坠落轨迹、反弹角度以及其与核心目标的相对距离。仔细描述人物引导事物发生运动状态改变的具体牵引动作、割断绳索或推倒支柱的手部发力以及迅速脱离引爆区的撤退走位。包含利用环境进行嘲讽或提示倒计时的言语沟通，不可省略角色对白。补充巨大物理结构崩塌瓦解时的重力撞击声与破碎飞溅物的环境穿透声。不要预设人物是否胸有成竹，不描写出环境反制结束后的清晰战果。完全呈现利用物理杠杆原理实现力量转化的外在动作轨迹 Stay in character)",
"无限·恐怖片 计谋·隐藏任务分析": "(无限·恐怖片 计谋·隐藏任务分析，描写团队依据现有信息对可能存在的隐藏任务进行分析与讨论的过程。根据当前已掌握的电影背景、主线线索及物品情况，展开描述角色们聚集商讨的场景客观细节。描写角色在陈述分析时的手势辅助、物证展示动作以及听取他人意见时的肢态变化。补充详细的讨论对白，角色如何推演剧情、列举线索及构建可能的隐藏目标。不预设分析的准确与否，注重体现思考盲区的碰撞与逻辑推演交锋。描述周遭环境此时处于相对静止状态，突出言语互动的节奏。丰富角色相互交响时的语气停顿、肢体语言交汇以及对任务本质的客观剖析。详细记录全员在讨论期间的站位与目光交互 Stay in character)",
"无限·恐怖片 计谋·战力道具测算": "(无限·恐怖片 计谋·战力道具测算，描写团队针对当前所处的严峻情景对现有战力与道具储备进行分析讨论的具体场景。根据当前困境展开角色清点物品、检查武器或审视自身状态的具体动作。描述角色如何将当前可用资源摆列或展示的过程，补充装备摩擦、弹药清点的细节声响。描写角色间关于应对策略的探讨对白，涉及战术组合、道具分配及行动方案的规划。不要预设策略是否完美，只展现根据客观条件进行组合推演的讨论状态。展开角色由于思考而产生的习惯性肢体动作，如手指敲击、比划战术地形等。记录此时团队的阵型分布，详细传递角色们如何在资源受限状态下进行交涉与筹备的动作细节 Stay in character)",

"无限·恐怖片 计谋·危险区域探路": "(无限·恐怖片 计谋·危险区域探路，描写单人或少部分人脱离主阵型进入未探明区域的协作状态。根据背景设定补充探路者前方区域的视野受限程度、介质密度以及后方大部队所处的相对安全环境细节。展开描写探路者试探性落脚的微动作特征与后方人员全神贯注观察前方动静的躯体准备姿态。包含前后方利用通讯设备或手势言语进行的信息交互对话，不可省略对白。刻画由于距离拉开导致的声音传递延迟与探路产生的极微小碰触声。不要预设探路者内心的被抛弃感或荣誉感，不出任何危机发生的事件结果。只专注不同分工人员各自的物理表征与信息传递行为本身 Stay in character)",
"无限·恐怖片 计谋·未知猜测讨论": "(无限·恐怖片 计谋·未知猜测讨论，描写团队针对尚未发生的模糊状态进行集体言语讨论的景象。补充场景周围无法看清的物理边界、环境带来的压抑空间感以及光源分布的不均等客观表现。展开人物在讨论时托着下巴的手势、来回踱步的肢体语言或是紧靠墙壁寻求支撑的肢体细节。包含对不同可能性进行语言构造假设的对话，不可省略完整的语言对白。丰富描写低声交谈时声音在空旷环境里的微弱回荡和讨论者无意识的摩擦声。不要预设人物自己是否相信自己的猜测，不引出任何猜测内容化为现实的情节。纯粹描述这种对不确定性做出大量言语建构的客观社交行为过程 Stay in character)",
"无限·恐怖片 计谋·情报分析争辩": "(无限·恐怖片 计谋·情报分析争辩，描写团队根据已有物件试图还原事实全貌的交互过程。补充所持情报物件的物质构造、摊开的图纸或物品占用的空间面积以及照明设备集中打光的光斑区域。展开描写人物用手点指线索位置、身体前倾靠近目标物以及视线快速在各种细节中穿梭的动作捕捉。包含推演逻辑时的语言交织与情报核对时的完整对话，不可省略对白。补充轻拍桌面的震动声、纸张翻动的清脆声或物件拼接的物理反馈。不要预设人物思维的对错与否，不要给出最终结论揭示的定论。专注在智力激荡过程中所伴随的真实客观躯体小动作与语言罗列 Stay in character)",
"无限·恐怖片 计谋·卡主神漏洞与规则欺骗": "（详细描写角色在字句缝隙中发掘运行破绽并着手规避惩罚机制的筹备过程。丰富刻画角色反复比对任务准则时手指在书写介质或投影表面快速划移的虚影，以及在角落用物理手段构建规避法阵或装置时刻笔刀尖与地面摩擦迸发的火星。客观呈现他们刻意制造伪证或假死状态下，心跳频率的降速、体表温度的人为冷却以及环境监测仪器被误导后发出的稳定绿光指示。补充角色因游走在抹杀边缘而产生的不自觉冷汗分泌过程。不预设欺骗手段的优劣和具体的执行路径，专注刻画对抗无上伟力监控时的惊险客观细节，展现逻辑对抗下极端安静却高度危险的局部空间变化，Stay in character）,",

"无限·恐怖片 团战·雷达预警与敌暗我明": "（细腻描绘预警装置突然捕捉到另一方踪迹时的客观反馈与周遭环境变轨。展开描述预警介质发出高频震动或刺耳频率时的物理表现，以及这些突发声响对处于明处角色听觉神经的直接刺激。客观勾勒角色在确认己方处于暴露状态时的肢体下意识回缩、脚步迈出的试探性踩踏以及隐蔽动作带起的衣物摩擦声。补充描写暗处环境中光线无法穿透的浓重阴影带，或是由远处传来的极其微小但不合理的树叶碎裂与风刃声。不预设双方对立面的实际动作与心理预期，专注刻画探测到未知接近时空气中凝固的紧绷感，详细呈现视觉死角带来的本能防备姿态与压抑呼吸的吞咽声，不可省略空间拉扯，Stay in character）,",
"无限·恐怖片 团战·与对方小队交涉": "（构建两方或多方阵营在遭遇与正式接触时进行言辞试探的客观环境细节。丰富描写交涉现场的空间距离感，双方站位对地面产生的重力压迫，以及周身能量场不自觉外溢导致周遭尘土的微弱旋转轨迹。客观呈现对话时的声音质感、语调在空气阻力中的传播响亮程度，以及各自展露随身武装形态时金属构件碰撞、能源充能发出的低鸣声。补充交涉期间双方视线在对方躯体特征、装具配置上的来回刮擦扫视，不预设交涉的最终和平与否或角色的善恶立场。专注描绘通过语气缓急和词汇选择来进行边界挤压的表面交锋，展现一种紧绷如满月之弓的对峙张力，不可缺少场域对峙细节，Stay in character）,",
"无限·恐怖片 团战·描述对方小队视角": "（展开描写从另一方阵营视野出发去观察和审视当前局势的客观画面呈现。丰富描绘这方从掩体后或特定高度俯视、平视时所捕捉到的光影视角，以及镜头转换时眼球对远近焦距调整的物理过程。客观记录他们针对目标对象特征进行观察时记录的实体细节，如对方装甲的磨损度、呼吸频率导致的胸腔起伏以及站位暴漏出的破绽。补充描写这只队伍所在环境本身带给他们的物理隐蔽感，以及他们相互打手势、低声耳语时声波在极小范围内的同频共振现象。不预设对方队伍的具体计谋与对当前主角团的态度喜恶，完全以旁观且充满审视意味的物理感官去描摹对方的客体存在，保持最高泛用性，Stay in character）,",
"无限·恐怖片 交涉·与土著势力的利益交涉": "（无限·恐怖片 交涉·与土著势力的利益交涉，描述小队在恐怖片世界中为获取支线情报或借用原著势力火力，与该位面本土顶级势力NPC进行对面谈判的场景。客观呈现谈判桌两侧的装备代差、对方护卫的戒备动作与上膛声。描写智囊或交涉者抛出伪造身份或跨时代利益筹码时的简短交易对白，以及土著NPC接过证物时物理上的试探。刻画己方火力手在暗处锁定土著首领的红外镭射光点或魔法锁定波动。不描写土著的内心震惊，也不带土著降智光环，只关注双方如何基于位面生存与任务需求进行冰冷残酷的资源互换与威慑平衡。Stay in character）",
"无限·恐怖片 交涉·与友善节点人物交涉身份": "(无限·恐怖片 交涉·与友善节点人物交涉身份，展开描述团队与当前维度核心正向土著单元（剧情主角类NPC）接触的客观场景。细化双方交流时的环境光影、背景噪音与周围物体的物理反馈。描写团队代表通过言辞抛出预设虚构身份的交涉对白，陈述伪造的身份文书、阵营标志或特定说辞。客观刻画该节点人物接收信息后的视线扫视、肢体小动作与语言回应，体现其对团队身份信息的初步判定状态。补充周围其他团队成员在交涉期间维持阵型、观察四周或待命的战术站位细节，全程聚焦于信息传递和身份合理化植入的表层互动框架。Stay in character)",
"无限·恐怖片 交涉·与中立势力交涉谋求合作": "(无限·恐怖片 交涉·与中立势力交涉谋求合作，展开描写团队在特定中立区域或遭遇中立土著势力代表时的接触过程。刻画交涉环境的基础物理特征、双方阵营的距离与武器收放状态等客观条件。描述团队代表递交虚假身份背景并提出合作利益交换的谈判对白，包含对目标物品、情报或路线的利益切割提议。描写中立势力聆听条件时的审视目光、动作停顿及权衡回报的语言反馈。补充团队在交涉过程中提供资源展示或实力证明的表层动作，体现利益纠葛下双方界限分明的试探过程，仅聚焦促成短期互惠同盟的客观交涉细节。Stay in character)",
"无限·恐怖片 交涉·与敌对阵营交涉谋求互不干涉": "(无限·恐怖片 交涉·与敌对阵营交涉谋求互不干涉，详细描绘团队与当前维度内具有敌意或潜在攻击性的势力代表遥相对峙或短兵相接前的交涉场景。重点刻画现场紧绷的物理氛围，如武器充能声、警报闪烁或视线锁定的压迫感。描写团队抛出特定阵营伪装与利益缓冲地带划分的冷硬对白，提出放弃某区域控制权或不涉入特定事件以换取停火的条件。客观呈现敌对势力对这些提议作出的威胁性肢体语言回应、武器微调或警告性言辞。补充团队在对峙时随时准备进入战斗或撤离的警戒姿态细节，展现高压态势下的临场周旋。Stay in character)",
"无限·恐怖片 交涉·与其他小队交涉缔结合作": "(无限·恐怖片 交涉·与其他小队交涉缔结合作，描写团队与另一方轮回小队在特定缓冲区域进行联合行动谈判的场景过渡。展开描写交涉场地的环境轮廓，以及双方战力在周边布置的对称性阵地或警戒视线交汇的细节。补充两队代表在绝对距离下进行利益陈述、确认双方主线任务无直接抹杀冲突的理性沟通对白，提出协同对付高阶目标或共享特定区域产出的条件。客观刻画在核实无误后，双方互撤部分防线或标记能量识别码的物理解除战备动作，展现抛弃阵营对立纯以生存得失为导向的客观联合框架确立过程。Stay in character)",
"无限·恐怖片 交涉·与其他小队交涉明确停战区域": "(无限·恐怖片 交涉·与其他小队交涉明确停战区域，展开描绘两支各自携带抹杀任务或高危武器的轮回小队在遭遇时为避免过度战损而进行的停战交涉。重点刻画双方持械状态下紧绷的场面质感、武器能量刻度的微光与视线在阵型间的游移。描写队伍之间清晰划定活动边界、宣告不再互相试探的精神链接喊话或物理广播对白。描述一旦达成互不侵犯共识后，双方队伍按照固定的倒步退去、直到脱离目视或扫描圈半径的阵型撤收动作细节。仅聚焦展现高压威慑下为了保持队伍建制完整而作出的僵硬妥协与空间切割操作。Stay in character)",
"无限·恐怖片 交涉·与其他小队进行情报流通交易": "(无限·恐怖片 交涉·与其他小队进行情报流通交易，描写团队与另一支轮回队伍在非敌对状态下交换关于主神空间隐藏规则或经历过的高阶位面信息的场景。详细还原交易地点的环境特征与屏蔽侦测器具展开时发出的低频嗡鸣声响。补充双方抛出所需情报范畴并对真伪进行逻辑盘问的语言来回，涉及兑换体系、基因锁突破门槛或特定陷阱位面的资料叙述。客观呈现双方通过某种介质（记录仪、记忆水晶或纯口述）完成数据对接的微小肢体动作，反映这种只停留于表面知识置换的短暂交互状态，不注入任何信任色彩。Stay in character)",
"无限·恐怖片 交涉·与其他小队进行实体资源交换": "(无限·恐怖片 交涉·与其他小队进行实体资源交换，展开描述两支队伍为了弥补当前任务短板或消耗品急缺而开展的物理资源互换流程。着重描写呈现在的武器、高阶恢复药剂或防御道具的外观材质、散发的能量荧光与物品碰撞时的清脆响声。补充双方针对物资产能、主神处原装兑换点数估值以及当前局势溢价情况进行的讨价还价对白。刻画在交接物品时各自保持的防御性距离与检验物品属性的确认动作。呈现一种纯粹基于生存消耗和装备互补建立的短暂资源流转图景，突显主神空间造物在不同小队之间的客观流通性。Stay in character)",
"无限·恐怖片 交涉·原住民交涉": "(无限·恐怖片 交涉·原住民交涉，描写角色与当前世界NPC进行接触与产生互动的具体过程。根据情景展开该NPC的外在特征，包括其穿着打扮、表面细节特征、面部动作习惯等客观存在细节。补充双方接触时所处的环境背景，如光线明暗、周围静物摆设。详细描写角色与NPC交流时的站位、身体侧向、手部下意识的动作以及视线的落点。展开双方的对白，包括角色如何进行试探、询问或交涉，以及NPC基于其认知做出的回应。不要预设NPC的情感倾向或配合程度，不可省略对白的具体内容。补充互动期间产生的微小动作声音，如衣物摩擦、步伐挪动等。专注于此刻双方由于交流产生的信息互换与肢体反馈机制。详细描述客观细节 Stay in character)",
"无限·恐怖片 交涉·分歧对立互怼": "(无限·恐怖片 交涉·分歧对立互怼，描写团队在面对决策点时产生严重不同意见的交互情况。根据情境补充导致分歧的物理标的物状态、各方所站立方位的对立性以及空间内因人员动作导致的气流变动。展开人物表达分歧时产生的肢体幅度扩大、手指方向明确以及面部血管凸起的客观表象。包含双方针锋相对、语速加快且高频重叠的对话，不可省略对白。补充因激烈动作导致周边物件被擦碰坠落或脚步重踏的声音细节。不要预设人物之间的关系好坏或是谁对谁错，不要描写分歧最终的达成结果。只专心呈现激烈的语言交锋与相伴随的物理空间肢体动作对抗 Stay in character)",
"无限·恐怖片 交涉·高压严肃对峙": "(无限·恐怖片 交涉·高压严肃对峙，描写团队成员之间因特定事态产生极度紧绷的交互氛围。补充当前所处空间的封闭性、光线下人物脸部的阴影投射以及周围环境绝对寂静的客观测度。详细描述人物僵持时的肌肉紧绷反馈、眼神的汇聚点固定以及手中物品无意识攥紧的物理现象。包含在这种极高压强下人物之间字句斟酌、毫不退让的对话，不可省略对白。丰富描写任何轻微动作如咽口水或衣服摩擦在这种对峙下的放大音效。不要预设此时角色心理是敌对还是仅仅是在思考，不要推动任何破局动作的出现。完全聚焦在这段静态但充满物理压力的空间状态展示 Stay in character)",
"无限·恐怖片 交涉·资源分配协商": "(无限·恐怖片 交涉·资源分配协商，描写多人在面对有限物质补给时的物理互动分配。根据设定补充眼前所有资源的具体容积体积、摆放方式以及周围人物视线死角的物理局限。详细描述双手拿起物资估量重量的操作、分配时物资的推拉动作以及视线在物资与其他人身上游移的状态。包含各自陈述需求理由以及确定分配结果的讨价还价对白，不可省略对话。描写物资彼此碰撞、包装袋撕扯或是抛接物品进入防具的清脆响动。不要预设角色内心的自私或无私倾向，不推进分配完毕后的后续走向。仅用最直白的方式客观呈现物资转移的物理经过与言语往来 Stay in character)",
"无限·恐怖片 交涉·团队休整对话": "(无限·恐怖片 交涉·团队休整对话，描写角色团队在任务间隙处于非战斗状态下的休息与对话场景。根据所处的庇护所或休息区域展开环境细节描写，包括此时的温湿度、光线性质以及供人倚靠或坐卧的客观地形。详细描写角色卸下战备、调整呼吸或舒展肢体的放松姿态及动作。补充角色间的闲谈对白，涉及对现状的陈述、日常交流或漫无目的探讨。不要预设角色对彼此的具体情感深度，只展现休息互动中的表层言语交锋与肢体反馈。记录角色手头无意识摆弄的物品及细碎的环境背景音。详细展示此时团队人员分散开来的相对位置，以及偶尔产生目光交汇或物品传递时的动作刻画 Stay in character)",
"无限·恐怖片 交涉·脱线日常调侃": "(无限·恐怖片 交涉·脱线日常调侃，描写团队脱离紧绷状态时发生的与环境基调反差的言语互动。补充场景中能提供暂时庇护的客观物理条件、人员分布的松散程度以及装备被随意放置的外在状态。详细刻画人物在交谈时放松的四肢摊开、无防备的面部肌肉走向以及附带随意把玩物件的小动作。包含双方或多方之间内容毫无逻辑关联或戏谑的话语对谈，不可省略对白。描写放松状态下人声的扩散范围与物件碰撞的随意声响。不要预设人物是真心实意的开心还是为了掩饰压力的伪装，不要转折到突发事件上。只对这段放松状态下的肢体语言和对话内容进行最原本的客观刻画 Stay in character)",
"无限·恐怖片 战斗·正面火力压制": "(无限·恐怖片 战斗·正面火力压制，描写角色面对目标时使用纯粹物理性或能量性力量进行正面打击的状态。补充周围承受打击后破坏剥落的表面材质纹理、空中弥漫的硝烟或粉尘密度以及空气被高温或震荡波扭曲的视觉现象。详尽刻画角色持械抗衡后坐力的肌肉收缩、脚部死死钉在地面的下沉轨迹以及持续输出动作中的机械重复感。包含伴随连续开火或猛烈打击时角色的怒吼或战术通报对话，不可省略对白。重墨描写弹壳坠地、重物狂砸以及环境被高强度撕裂的巨大噪音声响。不要预设角色的战斗意志高低，不评判压制带来的破坏结果是否足以消灭目标。仅表现纯正动作暴力的无差别倾泻 Stay in character)",
"无限·恐怖片 战斗·被动防守反击": "(无限·恐怖片 战斗·被动防守反击，描写角色处于极度被动状态下凭借掩体或绝对防御手段进行周旋抵挡的动作。根据防守对象补充物理掩护体的材质损耗、冲击波带来的环境余波以及防御阵地被迫压缩的客观范围。详细展开角色蜷缩身体最大化规避伤害的姿态、在承受重击瞬间骨骼发出的反馈动作以及寻找反击间隙的急充血状态。包含在防守极度吃力状态下从牙缝中挤出的指令或言语，不可省略对话。丰富记录外力剧烈撞击防御面产生的沉闷震音以及反击时撕裂阻碍的声音。不要预设人物内心的恐慌或隐忍，不要确定反击是否命中。单纯记录在被动挨打条件下的身体韧性动作 Stay in character)",
"无限·恐怖片 战斗·潜行暗杀制敌": "(无限·恐怖片 战斗·潜行暗杀制敌，描写角色在不可暴露的情况下接近并制服目标的客观行为。补充周身环境阴影的覆盖范围边界、行进路线上的介质吸收声音的效果以及目标视线的盲区数据。详细刻画角色放缓呼吸频率的胸腔变化、每踏出一步由脚跟向脚尖滚动的精准落步动作以及出击瞬间肌纤维的骤然收紧发力。包含在接近过程中压得极低的气流音与制敌瞬间极近距离的言语对白，不可省略。重点呈现刀尖刺入或肢体锁死时的轻微闷响以及被压制目标的身体抽搐摩擦声。不要预设施加者的心理是否冷血无情，不交代最终生死。仅展示对身体控制力达到极致的绝对安静扑杀过程 Stay in character)",

"无限·恐怖片 推进剧情·推进支线行动": "(无限·恐怖片 推进剧情·推进支线行动，描写角色正在执行或推进当前已开启支线任务的具体场景。根据支线要求展开描绘目标区域的客观形貌，包括物品摆设、地形特点及支线特定的环境布置。描写角色围绕该支线目标所进行的细节探测与行动，如搬运、破解、调查等行为的肢体展露。补充行动过程中的团队沟通对白，涉及针对当前小范围目标的协作分工或信息核实。不要预设支线的结果，只聚焦于正在发生的操作互动过程。丰富因角色行动而引发的环境微小变动与声响，如碎物掉落、表面灰尘扬起等事实细节。详细叙述每个角色在此区域内的占位、相互间的距离以及肢体活动的具体轨迹 Stay in character)",
"无限·恐怖片 推进剧情·阵型保持推进": "(无限·恐怖片 推进剧情·阵型保持推进，描写多人在移动过程中维系特定空间占位协作的过程。根据队伍结构补充每个人员占据方位的光照角度、视野无死角覆盖范围以及周遭的地形起伏细节。展开描写处于不同位置的人员其持械动作的差异、脚步的同频协调以及视野盲区互补的转头等机械动作。包含维持阵型时所需的战术口令或低语交流，不可省略对白。丰富人员之间由于装备摩擦或步伐一致所构成的环境连贯声响细节。不要预设成员心中是否对队友有绝对信任或存在猜忌，不要预判阵型是否遭遇外部冲击。专注还原多人协作时位置调配与物理空间的交互过程事实 Stay in character)",
"无限·恐怖片 推进剧情·倒计时紧迫推进": "(无限·恐怖片 推进剧情·倒计时紧迫推进，描写在具有时间限制的客观条件下的高频移动与行进状态。补充描写周围因时间推移而产生的客观规律性变化、倒计时机制的外在表现形式以及沿途环境的快速掠影。详细刻画人物在维持高频行进时下肢的跨越动作、重心的急剧转换以及由于剧烈运动带来的躯体汗液等客观生理表征。包含人物在急速状态下简短且伴随呼吸急促的对话，不可省略对白。描写极速行进造成的风声、脚步声与环境不断碰撞产生的物理声响。不要预设角色在极速状态下内心的压迫感大小，不要交代最终是否能在倒计时前完成推进。聚焦在这个高频行进过程的身体运作客观体现 Stay in character)",
"无限·恐怖片 推进剧情·密闭空间脱逃": "(无限·恐怖片 推进剧情·密闭空间脱逃，描写角色受困于封闭式恐怖环境并尝试离开的过程。根据背景设定补充密闭空间的材质硬度、空间尺寸变化、密闭带来的气温与气压改变等客观环境要素。详细描述人物试图破坏障碍或寻找出口时的物理打击动作、发力姿态以及肌体消耗状态。包含由于体力消耗而产生的客观生理声响以及人物之间的交流对白，不可省略对白。描写动作与障碍物碰撞或接触时的材质反馈声音。不要预设角色的心理是崩溃放弃还是斗志昂扬，不要指示最终是否成功脱逃。只聚焦于当前尝试脱困的客观行为展现，确保密闭场景的绝对客观真实设定 Stay in character)",
"无限·恐怖片 推进剧情·伤员护送转移": "(无限·恐怖片 推进剧情·伤员护送转移，描写团队在维持行动力受损成员共同行进时的空间调配与物理接触。补充伤员造成的重量负担分配、周遭逃生路线的地形崎岖程度以及转移过程中血液或体液留下的客观痕迹。详细刻画搀扶或搬运时的发力位置、重心偏移调节以及伤员本身因行动不便产生的肢体拖拽动作。包含人员在搬运过程中互相协调发力和对伤员的对话交谈，不可省略对白。描写肢体沉重磕碰与衣物拉拽挤压的丰富动静声响。不要预设救援者觉得是负累还是义不容辞，不要预设伤员自身的情感状态。专注多人在承重转移这一物理交互过程中带来的动态动作细节呈现 Stay in character)",
"无限·恐怖片 推进剧情·探寻主神空间起源": "（描写角色跳出任务逻辑框架，开始对高维主宰体根源进行逆向追溯与拆解的客观行为。详细展开角色破坏、剖析周遭具有规则象征性物品时的物理过程，如扯碎任务卷轴后纸屑的反重力飘浮，或重击边界屏障引起的空间涟漪与高频震碎声响。客观呈现他们寻找空间裂隙或底层代码外显现象时的视线焦灼状态，以及因违反核心设定而引发环境突变的物理压迫感，如重力骤加使周围地表迅速龟裂下陷。不预设他们是否能真正触及真相，仅深刻记录抗争行为带来的空气逆流、电磁风暴等具象化反扑表现，展现脱离既定轨道后整个维度引发的排斥效应，Stay in character）,",
"无限·恐怖片 推进剧情·理念分歧与队伍分裂": "（展开构建团队在面对极端存活逻辑时内部彻底决裂的残酷物理氛围与对峙现场。详细描绘分歧达到顶峰时角色们相互拉开的攻击安全距离，步履后撤在地面摩擦出的生硬声响，以及武器保险被依次解开、刀刃出鞘抵近时折射出的寒冷闪光。客观记录对立双方呼吸节奏的彻底错乱以及声带由于高度充血发出的嘶哑质问。补充因杀意弥漫导致周围空气如同实质般胶着的阻滞感，哪怕是一滴汗水砸落也会引发神经末梢的剧烈跳动。不偏袒或预设任何一方的道德正确性，仅细致刻画原本紧密的阵型如何分崩离析的战术切割走位，描绘这种内耗所引发的绝望物理静默，Stay in character）,",
"无限·恐怖片 推进剧情·区域封锁滞留": "(无限·恐怖片 推进剧情·区域封锁滞留，描写人物被迫停留在某片被物理隔绝的区域内的客观行为。根据设定补充周围隔绝介质的质感、不可跨越性的客观表现以及滞留空间内的现有物资布置等环境细节。展开描写人物处于停止行进状态下的肌体放松或紧绷的表现、视线巡视范围以及基础的生理活动动作。包含人员滞留在原地时互相之间的言语交谈，不可省略对白。丰富描写由于空间封闭而导致的微小动静被放大的听觉细节呈现。不要预设角色在这段时期内的思想状态是否焦躁或宁静，不要描绘外界隔绝物的下一步变化。专注在滞留期间人物最基本的动作维系与环境的静态交互 Stay in character)",
"无限·恐怖片 推进剧情·未知触发规避": "(无限·恐怖片 推进剧情·未知触发规避，描写人物面对可能的环境触发机制时的小心规避动作。根据具体场景补充阻挡物的大小、形状、危机源的物理特性以及周遭空气的流动感等客观细节。展开人物为避免触发机制而做出的肢体重心调整、肌肉绷紧状态以及呼吸的节奏变化。包含人员之间相互提醒的低声口头交流，不可省略对白。丰富描写处于边缘状态下周身衣物与环境轻微触碰造成的细微声响。不要预设人物内心是否慌乱或镇定，不要描写机关是否最终被触发的结果。只专注于在边缘试探与规避这一过程中的客观动作呈现与环境氛围的张力塑造，维持剧情的紧凑刻画 Stay in character)",
"无限·恐怖片 推进剧情·恐怖片即将结束进入光柱": "（无限·恐怖片 推进剧情·恐怖片即将结束进入光柱，详细描写恐怖片任务时限到达最后一秒，或者是最终目标被确认处决的断气瞬间。重点刻画千钧一发之际无敌光柱从虚空降下，彻底笼罩生还者的宏大割裂场景。展开描写绝对光柱截断周围一切怪物猛扑或能量爆炸的僵直特效，外界全部动作在此刻陷入冰冷的时停。补充幸存成员在光柱安全区内松开热武器、重创躯体倒地或冷血回眸的客观肢体表现。描述主神机械音宣告抹杀解除任务完成的冰冷播报，描绘恐怖片位面逐渐化为代码虚无的退场过程，宣告此轮生死倒计时的休止。Stay in character）",
"无限·恐怖片 遭遇·引入团战与对方小队": "（无限·恐怖片 遭遇·引入团战与对方小队，详细描写主神突然发布团战提示音或是感知到敌对小队降临的瞬间异象。展开关于正负两分、抹杀规则的具体播报内容，以及小队成员接收到对方小队评级信息时的动作停顿。补充队长/智囊迅速改变原有计划，分析两队降临时间差代表的强弱评判，制定针对敌方狙击手、精神力控制者的防备策略的对白。客观描写精神力扫描被弹开或反向入侵时的能量激荡现实反馈。不预设对敌方的恐惧或轻视，重点刻画由于同类竞争带来的绝杀空间气氛，与快速重新分配火力的队伍执行力展现。Stay in character）",
"无限·恐怖片 遭遇·截获敌对小队通讯": "（无限·恐怖片 遭遇·截获敌对小队通讯，描绘团战期间，小队精神力者或科技后勤意外捕获另一支轮回小队坐标与战术频道的瞬间。详细描写精神力链接中突兀插入的刺耳杂音，或是通讯终端刷屏解码的绿色数据流闪烁。补充破译出敌方正准备针对己方薄弱点进行狙击或陷阱布置的简短机密录音对话重放。描写队长听闻情报后手势示意全员静默、悄无声息改变行走路线的反包围阵型调度。客观呈现各种隐形探测器升空、反侦察结界开启时的环境光线扭曲折射。重点记录这种掌握敌暗我明情报优势后，迅速转化为冷酷杀戮布置的战前静态氛围。Stay in character）",
"无限·恐怖片 遭遇·察觉第三方小队介入痕迹": "(无限·恐怖片 遭遇·察觉第三方小队介入痕迹，详细描述团队在关键任务地点发现明显不属于当前位面土著的力量破坏残留或事件被截胡的场景。客观呈现超越该世界科技或魔法体系的物理痕迹：如不符合时代的弹壳、融化的地形截面或是特殊能量残留的光膜。补充队伍核心发现这些突兀证据并迅速作出第三方乱入判断的验证性对白，分析这些痕迹代表的能力倾向。描写队员扩大警戒圈、对可能潜伏方向进行扫描探测并改变武器使用级别的表层列阵动作，体现出多队竞争介入下已知情报网被外力强制撕裂的客观变局。Stay in character)",
"无限·恐怖片 遭遇·恐怖片剧情展开与危机突发": "（无限·恐怖片 遭遇·恐怖片剧情展开与危机突发，描绘原本平静或蛰伏的恐怖片环境突然爆发出剧烈变故。丰富描述怪诞现象的显现、高阶怪物的初步怒吼、或是原著剧情产生崩坏性逆转的客观空间表象。刻画环境因超自然力量或重火器而产生的地形碎裂、粉尘弥漫的物理效果。补充小队成员在危机瞬间作出的肌肉记忆闪避、防御道具的瞬间展开动作。描写急促简短的战术指令对白，展现出冷冰冰的指令下达，只展现快速判断危险源级别、是否撤退或就地反击的冷酷权衡视角。专注描绘无限流应对不可言说危机时的人性本能与残酷。Stay in character）",
"无限·恐怖片 遭遇·环境异常突变": "(无限·恐怖片 遭遇·环境异常突变，描写场景环境发生未知的物理层级突变的瞬间。根据当前空间补充发生异变的具体视觉表现、光线的瞬间扭曲、物质形态的转变以及空气密度的客观变化。展开人物在察觉到物理变动第一秒的肢体本能位移、瞳孔反射以及防御性动作的细节。包含角色在异变突生时最直接的言语反应，不可省略对白。丰富刻画异变过程中环境发出的剧烈声响或极度安静的反常静音状态。不要预设人物是感到惊骇还是习以为常，不要描写突变带来的后续致命打击效果。仅仅呈现环境瞬间改变这一行为过程及其带来的首波动静互动，保持描写的极度客观 Stay in character)",
"无限·恐怖片 遭遇·场景环境变动": "(无限·恐怖片 遭遇·场景环境变动，描写当前所处场景与自然环境正在发生的客观变化。根据世界观设定展开环境因素的细节，包括气温的升降、光影的变幻、空气中悬浮物或湿度的改变等。丰富描写这些自然环境因素对建筑物、植物或地形所造成的具体物理侵蚀与改变。描写角色处在此时环境下的身体自然反应，如衣物的飘动、发丝的垂落或生理上的自发调节动作。不要预设该环境是危险还是安全，仅客观描述其演化过程。补充因环境变动而产生的各项拟声词与自然白噪音。详细呈现角色在环境变动中的站位调整及其为了适应现状所做出的肢体动作。不可以粗略概括，专注于勾勒场景全貌与微观细节 Stay in character)",
"无限·恐怖片 遭遇·陷入异常不利环境因素": "(无限·恐怖片 遭遇·陷入异常不利环境因素，展开描述团队深入某一区域时，触发未预见的环境危害或维度规则恶化的连带反应过程。细致刻画环境要素的异变，如毒气弥漫的速度、磁场紊乱导致仪器失效的物理火花、或是温度剧变造成的体表凝霜与汗水蒸发。描写负责侦测的成员通报环境数据骤降或生存时间压缩的急促对白。补充队员切换环境适应装备、启动防护罩以及在受限地形中艰难改变行进步伐的客观动作展现。展示剧情变更导向直接削弱队伍机动性与生存资源消耗的恶劣外在条件闭环。Stay in character)",
"无限·恐怖片 遭遇·察觉主线剧情走向异常": "(无限·恐怖片 遭遇·察觉主线剧情走向异常，展开描写团队在推进当前维度任务时，目睹关键性事件的发展偏离已知剧情轨迹的客观现场。详细还原异常发生的物理过程，例如关键道具被提前破坏、核心目标提前失踪或突发爆炸产生的震动与碎屑散落细节。补充团队信息分析位面的成员对偏离节点进行比对与说明的对白，陈述已知情报与眼前现实的矛盾之处。刻画队伍停下当前行动步调，重新查阅任务状态栏、检查周围残留痕迹并做出警戒防卫的表层动作，只强调剧情发生不可逆转的蝴蝶效应时的外部环境反馈。Stay in character)",
"无限·恐怖片 遭遇·察觉敌对目标强度异常": "(无限·恐怖片 遭遇·察觉敌对目标强度异常，描写团队在遭遇设定目标或常规维度敌人时发现其物理破坏力或存活难度出现跨阶跃升的实战场景。客观刻画异常变异的体表特征爆发，如武器无法击穿的装甲增厚、未知能量波动的闪烁以及攻击产生的地形碎裂或声浪激荡。补充核心战斗人员简短报出伤害数据无效或敌方形态升级的战术对白。描绘队伍面对突变强度时本能拉开距离、更换高能级武器或调整防御阵型的肢体连贯动作。聚焦于敌方数值膨胀与超越原有预期的破坏力展现，不描写主观情绪，纯粹呈现战况升级的客观现象。Stay in character)",

function init() {
        const nav = document.getElementById('catNav');
        const categories = Object.keys(commandData);
        
        if (categories.length === 0) {
            document.getElementById('cat-display').innerText = "数据错误";
            return;
        }

        nav.innerHTML = '';
        categories.forEach((cat, idx) => {
            const btn = document.createElement('button');
            btn.className = 'cat-btn' + (idx === 0 ? ' active' : '');
            btn.innerText = cat;
            btn.onclick = () => {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderOptions(cat);
            };
            nav.appendChild(btn);
        });
        
        // 强制首次渲染
        renderOptions(categories[0]);
    }

    function renderOptions(cat) {
        const grid = document.getElementById('commandGrid');
        const display = document.getElementById('cat-display');
        grid.innerHTML = '';
        display.innerText = "当前：" + cat;

        const options = commandData[cat];
        Object.keys(options).forEach(key => {
            const card = document.createElement('div');
            card.className = 'option-card';
            card.innerHTML = `<div class="label">${key}</div>`;
            card.onclick = () => { 
                document.getElementById('mainOutput').value = options[key]; 
            };
            grid.appendChild(card);
        });
    }

function addTag(name) {
        const area = document.getElementById('mainOutput');
        let tagText = "";
        
        // 映射按钮参数到对应文本
        if (name === '优') tagText = "女人指代优";
        else if (name === '秀') tagText = "男人指代秀";
        else if (name === 'User') tagText = "男人指代User";
        else tagText = `指代${name}`;

        // 追加到输入框，不覆盖原有内容
        area.value = (area.value ? area.value + "\n" : "") + tagText;
    }

    function resetNovel() {
        const area = document.getElementById('mainOutput');
        const resetText = "回到互动式小说格式，移除上文所有的特殊格式/标签/符号";
        area.value = (area.value ? area.value + "\n" : "") + resetText;
    }

    // 实现将文字注入到酒馆下方的输入栏
    function sendToInput() {
        const text = document.getElementById('mainOutput').value.trim();
        if (!text) return;

        // 尝试寻找酒馆主界面的输入框
        // SillyTavern 的默认输入框 ID 通常是 #send_textarea
        let stInput = window.parent.document.getElementById('send_textarea');
        
        if (stInput) {
            stInput.value = text;
            // 触发输入事件以便酒馆检测到内容变化
            stInput.dispatchEvent(new Event('input', { bubbles: true }));
            
            // 视觉反馈
            const btn = document.querySelector('.btn-send');
            btn.innerText = "已注入";
            setTimeout(() => { btn.innerHTML = "发送<br>指令"; }, 1000);
        } else {
            // 无法直接访问时，降级为复制功能
            navigator.clipboard.writeText(text);
            alert("已复制。请手动粘贴到下方输入栏。");
        }
    }

    // 确保 DOM 加载后运行
    document.addEventListener('DOMContentLoaded', init);
    // 针对 load() 场景的额外触发
    setTimeout(init, 500);
// 安全注入：快捷指令按钮组（不破坏原有HTML结构）
    window.addEventListener('DOMContentLoaded', () => {
        const textarea = document.getElementById('mainOutput');
        if (!textarea) return;

        // 创建按钮容器
        const btnContainer = document.createElement('div');
        btnContainer.style.display = 'flex';
        btnContainer.style.gap = '8px';
        btnContainer.style.marginBottom = '8px';
        btnContainer.style.flexWrap = 'wrap';
        btnContainer.style.flexShrink = '0'; // 防止被挤压变形

            },

                label: '第一人称', 
                text: '（本次回复请严格使用第一人称视角进行描写，代入角色本身的感官和心理活动。Stay in character）'

            }
        ];

        // 循环生成按钮并赋予样式
        buttons.forEach(btnInfo => {
            const btn = document.createElement('button');
            btn.textContent = btnInfo.label;
            // 默认样式
            btn.style.background = 'var(--light-gray, #3a3a3a)';
            btn.style.color = 'var(--text-main, #e0e0e0)';
            btn.style.border = '1px solid var(--border, rgba(220, 20, 60, 0.2))';
            btn.style.padding = '6px 10px';
            btn.style.borderRadius = '4px';
            btn.style.cursor = 'pointer';
            btn.style.fontSize = '12px';
            btn.style.transition = 'all 0.2s';

            // 鼠标悬浮特效
            btn.onmouseover = () => { 
                btn.style.background = 'var(--blood-red, #e03131)'; 
                btn.style.color = 'white'; 
            };
            btn.onmouseout = () => { 
                btn.style.background = 'var(--light-gray, #3a3a3a)'; 
                btn.style.color = 'var(--text-main, #e0e0e0)'; 
            };

            // 点击事件：保留原有内容，并换行追加新内容
            btn.onclick = () => {
                textarea.value = (textarea.value ? textarea.value + '\n\n' : '') + btnInfo.text;
            };

            btnContainer.appendChild(btn);
        });

        // 将按钮组安全地插入到输入框的正上方
        textarea.parentNode.insertBefore(btnContainer, textarea);
    });
